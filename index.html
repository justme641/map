<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#fff;--fg:#1f2430;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--danger:#dc2626;--panel:#f8fafc}
@media (prefers-color-scheme:dark){:root{--bg:#161a22;--fg:#e8eaf0;--muted:#9aa3b2;--line:#2b3140;--accent:#60a5fa;--danger:#f87171;--panel:#1d222c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--fg);background:var(--bg)}
#app{display:flex;height:100%}
#map{flex:1;min-width:0;height:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#map .leaflet-popup{-webkit-user-select:text;user-select:text}
#sidebar{width:340px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg);order:-1}
body.side-closed #sidebar{display:none}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}
#tabs button{flex:1 0 auto;border:0;background:none;padding:8px 8px;white-space:nowrap;color:var(--muted);cursor:pointer;font:inherit;border-bottom:2px solid transparent;border-radius:0}
#tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
#panes{flex:1;overflow:auto;padding:12px}
.pane{display:none}.pane.on{display:block}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger)}
label{display:block;margin-bottom:8px;font-size:12px;color:var(--muted)}
label>input,label>select,label>textarea{margin-top:3px;font-size:14px;color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{color:var(--muted);font-size:12px}
.items{list-style:none;margin:8px 0;padding:0}
.items li{display:flex;gap:10px;padding:9px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.items li:hover{background:var(--panel)}
.items .ic{font-size:20px;line-height:1.2}
.items .t{font-weight:600}
.filters{display:grid;grid-template-columns:1fr 130px;gap:8px}
.catrow{display:grid;grid-template-columns:52px 1fr 40px 32px;gap:6px;margin-bottom:6px;align-items:center}
.catrow input[type=color]{padding:0;height:34px}
.pin{background:none;border:0}
#camAlert{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:2600;display:none;max-width:92vw;background:#dc2626;color:#fff;padding:12px 18px;border-radius:14px;font-size:17px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.5);text-align:center}
#pickBar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:2500;display:none;gap:8px;align-items:center;background:#111e;color:#fff;padding:7px 8px 7px 14px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#pickBar button{padding:3px 10px;border-radius:14px}
#map.picking,#map.picking .leaflet-grab,#map.picking .leaflet-interactive{cursor:crosshair !important}
.rpin{width:26px;height:26px;border-radius:50%;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;box-shadow:0 1px 5px rgba(0,0,0,.5)}
dialog{max-height:92vh;overflow:auto}
.zoombox{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg);color:var(--fg);border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.zoombox{gap:4px}
.zoombox input{width:104px;padding:0;border:0}
.zoombox b{min-width:22px;text-align:center}
.zoombox button{padding:2px 9px;font-size:18px;line-height:1.2;border:0;background:transparent;color:var(--fg);border-radius:6px}
.zoombox button:hover{background:var(--panel)}
.leaflet-control-scale-line{background:rgba(255,255,255,.8);color:#222}
table.pv{width:100%;border-collapse:collapse;font-size:12px}
table.pv td,table.pv th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left}
.items li.wrap{flex-wrap:wrap}
.items .btns{display:flex;gap:6px;width:100%}
.items .btns button{padding:3px 8px;font-size:12px}
h4{margin:14px 0 6px}
.hrsbox{margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:10px}
.hr{display:grid;grid-template-columns:64px 1fr auto 1fr;gap:6px;align-items:center;margin-bottom:5px}
.hr .hd{margin:0;display:flex;gap:4px;align-items:center;color:var(--fg);font-size:13px}
.hr input[type=checkbox]{width:auto;margin:0}
.hr input[type=time]{width:100%;min-width:0;padding:5px 6px;margin:0}
.pin-body{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pin-body span{transform:rotate(45deg);font-size:15px}
.pp{min-width:190px}.pp h3{margin:0 0 4px;font-size:15px}.pp p{margin:6px 0;white-space:pre-wrap}
.pp .row{margin-top:8px}.pp button{padding:5px 8px;font-size:12px}
dialog{border:1px solid var(--line);border-radius:14px;padding:18px;width:min(92vw,380px);background:var(--bg);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 12px;font-size:16px}
#fab{position:absolute;z-index:1000;top:10px;right:10px;display:flex;flex-direction:column;gap:8px}
#fab button{background:var(--bg);box-shadow:0 1px 5px rgba(0,0,0,.35);border:0;font-size:16px;padding:8px 11px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111c;color:#fff;padding:9px 16px;border-radius:20px;z-index:3000;display:none;max-width:90vw}
.dh{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-18px;z-index:2;background:var(--bg);margin:-18px -18px 12px;padding:12px 14px 10px 18px;border-bottom:1px solid var(--line)}
.dh h2{margin:0}
.dh button{border:0;background:transparent;font-size:20px;line-height:1;padding:4px 10px;border-radius:8px}
.seg{display:flex;margin-bottom:10px}
.seg button{flex:1;border-radius:0;padding:6px 8px}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on,.srcbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
select.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.backbar{margin-bottom:10px}
.catrow2{display:grid;grid-template-columns:40px 1fr 40px 30px 30px 30px;gap:5px;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.catrow2.sub{margin-left:18px}
.catrow2 input[type=color]{padding:0;height:34px}
.catrow2 button{padding:5px 0}
.catrow2 .par,.catrow2 .emopick{grid-column:1/-1}
.catrow2 .par{font-size:12px;padding:4px 6px}
.emopick{display:flex;flex-wrap:wrap;gap:2px}
.emopick button{padding:3px 5px;font-size:18px;border:0;background:transparent}
.emopick input{width:110px;margin-left:6px}
@media (max-width:760px){
  #app{flex-direction:column}
  #sidebar{order:2;width:100%;height:46vh;border-right:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <aside id="sidebar">
    <nav id="tabs"></nav>
    <div id="panes"></div>
  </aside>
</div>
<div id="fab">
  <button id="btnSide" title="顯示/隱藏側邊欄">☰</button>
  <button id="btnLocate" title="回到我的位置（GPS 定位）">🎯</button>
</div>
<dialog id="dlg"><div class="dh"><h2 id="dlgTitle"></h2><button type="button" id="dlgX" title="關閉" aria-label="關閉">✕</button></div><div id="dlgBody"></div></dialog>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =====================================================================
 * 個人專屬地圖 — 階段一 + 階段二
 *
 * 架構與後續擴充點（階段三、四請從這裡接）：
 *  - Store.state = { version, categories[], markers[], routes[] , ...未知欄位會保留 }
 *      routes 已預留，建議結構：
 *      { id, name, profile:'foot'|'driving'|'bike', waypoints:[{lat,lng}],
 *        geometry:[[lat,lng],...], distance(m), duration(s), createdAt, track?:[{lat,lng,t}] }
 *  - Bus：簡易事件匯流排。已發出 marker:added / marker:updated / marker:removed / data:changed
 *  - UI.addTab({id,label,init(el),refresh?()})：新增側邊欄分頁（階段三的「路線」分頁用這個）
 *  - Hooks.navigateTo(marker)：階段三實作後，彈窗的「規劃從目前位置到這裡」就會呼叫它
 *  - App.getLocation()：回傳 Promise<{lat,lng}>，供導航起點使用
 *  - Store.exportJSON / importJSON：已涵蓋整個 state，未來新增的資料自動進入備份
 * ===================================================================== */
'use strict';

const KEY = 'personalMap.v1';
const VIEW_KEY = 'personalMap.view';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const isHex = s => /^#[0-9a-f]{6}$/i.test(s);
const stars = n => n > 0 ? '★'.repeat(n) + '☆'.repeat(5 - n) : '';
const fmtDate = ts => { if (!ts) return '—'; const d = new Date(ts), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const houseNo = n => { n = String(n || '').trim(); return n ? (/[號号]\s*$|[號号]之|[樓楼]/.test(n) ? n : n + '號') : ''; };   // OSM 門牌常已含「號」，避免重複
const fmtDist = m => m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km';
const hav = (a, b) => { const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r,
  x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2; return 12742000 * Math.asin(Math.sqrt(x)); };

function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms);
}

const Bus = {
  h: {},
  on(e, f) { (this.h[e] = this.h[e] || []).push(f); },
  emit(e, d) { (this.h[e] || []).forEach(f => f(d)); }
};

const Hooks = { navigateTo: null };   // 階段三實作

/* ---- 共用：複製、分享、座標彈窗 ---- */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('✅ 已複製'); return true; }
  catch (e) {
    const a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0;top:0'; document.body.appendChild(a); a.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (x) {} a.remove();
    toast(ok ? '✅ 已複製' : '複製失敗，請長按文字手動複製', 3000); return ok;
  }
}
async function shareText(o) {   // 手機會叫出系統分享選單；不支援時改為複製
  if (navigator.share) { try { await navigator.share(o); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  copyText([o.text, o.url].filter(Boolean).join('\n'));
}
const gLink = (lat, lng) => `https://www.google.com/maps?q=${(+lat).toFixed(6)},${(+lng).toFixed(6)}`;
const llText = ll => `${(+ll.lat).toFixed(6)}, ${(+ll.lng).toFixed(6)}`;
function coordPopup(title, ll, o = {}) {
  const d = document.createElement('div'); d.className = 'pp';
  d.innerHTML = `<h3>${esc(title)}</h3><div class="muted" data-r="addr"></div><div class="muted">${llText(ll)}${o.acc ? `｜誤差約 ${Math.round(o.acc)} 公尺` : ''}</div>
    <div class="row"><button data-a="copy">📋 複製座標</button><button data-a="share">📤 分享</button><button data-a="g">🗺️ Google 地圖</button>${o.nav ? '<button class="primary" data-a="nav">🧭 導航到這裡</button>' : ''}${o.add ? '<button data-a="add">＋ 新增標記</button>' : ''}</div>`;
  d.onclick = e => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === 'copy') copyText(llText(ll));
    else if (a === 'share') shareText({ title, text: `${title}\n${llText(ll)}`, url: gLink(ll.lat, ll.lng) });
    else if (a === 'g') window.open(gLink(ll.lat, ll.lng), '_blank', 'noopener');
    else if (a === 'nav') Hooks.navigateTo({ lat: ll.lat, lng: ll.lng, name: o.name || title, addr: o.addr || '', named: !!o.name });
    else if (a === 'add') { map.closePopup(); Form.openNew({ lat: ll.lat, lng: ll.lng }, { name: o.name || '', addr: o.addr || '' }); }
  };
  d.setInfo = (name, addr) => {   // 反查到地名／地址後更新彈窗
    o.name = name || o.name || ''; o.addr = addr || '';
    if (name) d.querySelector('h3').textContent = '📍 ' + name;
    d.querySelector('[data-r=addr]').textContent = addr ? '📮 ' + addr : '';
  };
  return d;
}
/* 長按／右鍵地圖任一點：標出該點並顯示座標彈窗（複製、分享、導航、新增標記），並自動反查地址 */
const Pin = {
  layer: null, last: null,
  at(ll) {
    if (!this.layer) this.layer = L.layerGroup().addTo(map);
    this.layer.clearLayers();
    const el = coordPopup('📍 選取的位置', ll, { nav: true, add: true });
    const mk = L.circleMarker([ll.lat, ll.lng], { radius: 9, color: '#fff', weight: 3, fillColor: '#f97316', fillOpacity: 1 }).addTo(this.layer);
    mk.bindPopup(el).openPopup();
    mk.on('popupclose', () => { if (this.layer) this.layer.removeLayer(mk); });
    this.last = el;
    if (Store.state.settings.autoGeocode !== false) {
      Geo.reverse(ll.lat, ll.lng).then(r => {
        if (!r || this.last !== el) return;
        const n = String(r.name || (r.namedetails && r.namedetails.name) || '').trim();
        el.setInfo(n, r.display_name || '');
      }).catch(() => {});
    }
    return el;
  }
};
/* 地圖選點模式：顯示提示列與十字游標，可按「取消」離開 */
const PickBar = {
  el: null,
  show(on) {
    if (!this.el) {
      const d = document.createElement('div'); d.id = 'pickBar'; d.innerHTML = '<span>📍 請在地圖上點一下，選擇位置</span><button type="button">取消</button>';
      d.querySelector('button').onclick = () => { App.pick = null; };
      document.body.appendChild(d); this.el = d;
    }
    this.el.style.display = on ? 'flex' : 'none';
    const m = $('#map'); if (m) m.classList.toggle('picking', on);
  }
};

/* ---------------- Store ---------------- */
const Store = {
  state: null,
  fresh() {
    return {
      version: 1,
      categories: [
        { id: 'food',       name: '美食',     emoji: '🍜', color: '#ef4444', parent: '' },
        { id: 'brunch',     name: '早午餐',   emoji: '🥞', color: '#f97316', parent: 'food' },
        { id: 'restaurant', name: '餐廳',     emoji: '🍽️', color: '#dc2626', parent: 'food' },
        { id: 'snack',      name: '小吃',     emoji: '🥟', color: '#fb7185', parent: 'food' },
        { id: 'secret',     name: '私房景點', emoji: '⭐', color: '#a855f7', parent: '' },
        { id: 'other',      name: '其他',     emoji: '📍', color: '#6b7280', parent: '' }
      ],
      markers: [],
      routes: [],
      places: [],      // 常用地點 {id,name,lat,lng}
      settings: { v: 3, startMode: 'gps', defaultPlaceId: '', defaultZoom: 17, searchRadiusKm: 2, autoGeocode: true, longPressMs: 700, scope: { country: 'tw', region: '' } }
    };
  },
  normalize(d) {
    const f = this.fresh();
    d = (d && typeof d === 'object') ? d : {};
    let cats = (Array.isArray(d.categories) ? d.categories : []).filter(c => c && c.id)
      .map(c => ({ id: String(c.id), name: String(c.name || '未命名'), emoji: String(c.emoji || '📍'), color: isHex(c.color) ? c.color : '#6b7280', parent: c.parent ? String(c.parent) : '' }));
    if (!cats.length) cats = f.categories.map(c => ({ ...c }));
    if (!cats.some(c => c.id === 'other')) cats.push({ ...f.categories.find(c => c.id === 'other') });
    cats.forEach(c => { const p = cats.find(x => x.id === c.parent); if (!p || p.parent || p.id === c.id) c.parent = ''; });
    const ids = new Set(cats.map(c => c.id));
    const markers = (Array.isArray(d.markers) ? d.markers : [])
      .filter(m => m && Number.isFinite(+m.lat) && Number.isFinite(+m.lng))
      .map(m => ({
        id: String(m.id || uid()), name: String(m.name || '未命名'),
        catId: ids.has(m.catId) ? m.catId : 'other',
        rating: Math.min(5, Math.max(0, parseInt(m.rating) || 0)),
        note: String(m.note || ''), lat: +m.lat, lng: +m.lng,
        addr: String(m.addr || ''), hours: String(m.hours || ''), hoursUpdatedAt: +m.hoursUpdatedAt || 0,
        hoursData: (m.hoursData && typeof m.hoursData === 'object') ? m.hoursData : null, hoursNote: String(m.hoursNote || ''),
        src: m.src || '', osmId: m.osmId || '', batch: m.batch ? String(m.batch) : '', batchName: String(m.batchName || ''), speedLimit: Math.max(0, parseInt(m.speedLimit) || 0), dir: String(m.dir || ''),
        createdAt: m.createdAt || Date.now(), updatedAt: m.updatedAt || Date.now()
      }));
    const places = (Array.isArray(d.places) ? d.places : []).filter(p => p && Number.isFinite(+p.lat) && Number.isFinite(+p.lng))
      .map(p => ({ id: String(p.id || uid()), name: String(p.name || '未命名'), lat: +p.lat, lng: +p.lng }));
    const ds = (d.settings && typeof d.settings === 'object') ? d.settings : {};
    const settings = { ...f.settings, ...ds };
    if (!settings.scope || typeof settings.scope !== 'object') settings.scope = { country: 'tw', region: '' };
    if (settings.scope.region === 'custom') settings.scope.region = '';   // 已移除「自訂區域」
    delete settings.scopeBox;
    if (!(ds.v >= 2)) { settings.v = 2; settings.defaultZoom = 17; }   // 預設縮放改為 17（舊資料只遷移一次，之後依你的設定）
    settings.searchRadiusKm = Math.min(5, Math.max(0.1, +settings.searchRadiusKm || 2));
    if (!(ds.v >= 3)) {   // 一次性整理：刪除沒用到的「咖啡、住宿」，補上美食底下的子分類
      settings.v = 3;
      const used = new Set(markers.map(m => m.catId));
      cats = cats.filter(c => !((c.id === 'cafe' || c.id === 'stay') && !used.has(c.id)));
      if (cats.some(c => c.id === 'food' && !c.parent)) f.categories.filter(c => c.parent === 'food').forEach(c => { if (!cats.some(x => x.id === c.id)) cats.push({ ...c }); });
    }
    return { ...d, version: 1, categories: cats, markers, routes: Array.isArray(d.routes) ? d.routes : [], places, settings };
  },
  load() {
    try { const r = localStorage.getItem(KEY); this.state = r ? this.normalize(JSON.parse(r)) : this.fresh(); }
    catch (e) { this.state = this.fresh(); }
  },
  save() {
    try { localStorage.setItem(KEY, JSON.stringify(this.state)); }
    catch (e) { toast('⚠️ 瀏覽器儲存失敗，請盡快匯出備份'); }
  },
  fileName() {   // 匯出檔名＝資料名稱＋日期
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const nm = String(this.state.dataName || '我的地圖').replace(/[\\\/:*?"<>|]/g, '').trim() || 'my-map';
    return `${nm}-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.json`;
  },
  exportJSON() {
    const blob = new Blob([JSON.stringify({ ...this.state, dataName: this.state.dataName || '我的地圖', exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = this.fileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  importJSON(text, overwrite) {
    const inc = this.normalize(JSON.parse(text));
    if (overwrite) { this.state = inc; }
    else {
      const mergeBy = (a, b) => { const m = new Map(a.map(x => [x.id, x])); b.forEach(x => m.set(x.id, x)); return [...m.values()]; };
      const cur = this.state;
      this.state = this.normalize({
        ...cur, ...inc,
        categories: mergeBy(cur.categories, inc.categories),
        markers: mergeBy(cur.markers, inc.markers),
        routes: mergeBy(cur.routes, inc.routes),
        places: mergeBy(cur.places, inc.places),
        dataName: cur.dataName || inc.dataName || '',
        settings: cur.settings
      });
    }
    this.save(); Bus.emit('data:changed');
    return inc.markers.length;
  }
};

    const now = Date.now(), cur = Store.state.markers; let n = 0, dup = 0;

};

/* ---------------- Geo：Nominatim 反查地名 + Overpass 查附近 ----------------
 * 皆為 OpenStreetMap 免費服務、免 API Key。請勿高頻率呼叫（Nominatim 限制約每秒 1 次，
 * 本程式只在「點擊地圖」或按「查詢地名」時才呼叫一次）。 */
const Geo = {
  OP: ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://overpass.private.coffee/api/interpreter'],
  _c: new Map(),   // 查詢快取（5 分鐘），重複查同一處不再打伺服器
  async json(url, opt, ms = 15000) {
    const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
    try { const r = await fetch(url, { ...opt, signal: ac.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
    finally { clearTimeout(t); }
  },
  reverse(lat, lng) {
    return this.json(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&extratags=1&namedetails=1&accept-language=zh-TW,zh,en`);
  },
  async overpass(q, ms = 35000) {   // 同時問多個鏡像伺服器，誰先回來用誰，其餘取消
    const hit = this._c.get(q);
    if (hit && Date.now() - hit.t < 300000) return hit.v;
    const acs = this.OP.map(() => new AbortController());
    try {
      const v = await Promise.any(this.OP.map(async (u, i) => {
        const t = setTimeout(() => acs[i].abort(), ms);
        try {
          const r = await fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'data=' + encodeURIComponent(q), signal: acs[i].signal });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const j = await r.json();
          if (j.remark && !(j.elements || []).length && /error|timeout|exceeded/i.test(j.remark)) throw new Error(j.remark);
          return j.elements || [];
        } finally { clearTimeout(t); }
      }));
      acs.forEach(a => a.abort());
      this._c.set(q, { t: Date.now(), v });
      return v;
    } catch (e) { throw (e && e.errors && e.errors[0]) || e; }
  },
  addrFromTags(t) {
    if (t['addr:full']) return t['addr:full'];
    return [t['addr:city'], t['addr:district'] || t['addr:suburb'], t['addr:street'], houseNo(t['addr:housenumber'])].filter(Boolean).join('');
  },
  toPlace(e) {
    const t = e.tags || {}, lat = e.lat ?? (e.center && e.center.lat), lng = e.lon ?? (e.center && e.center.lon);
    if (lat == null || lng == null) return null;
    return { name: t.name || t['name:zh'] || t.brand || t.operator || t.ref || '（未命名）', lat, lng, tags: t,
      addr: this.addrFromTags(t), hours: t.opening_hours || '', phone: t.phone || t['contact:phone'] || '', limit: parseInt(t.maxspeed) || 0, osmId: e.type + '/' + e.id };
  },
  async suggest(lat, lng) {
    const ctr = { lat, lng };
    const [nom, ov] = await Promise.allSettled([
      this.reverse(lat, lng),
      this.overpass(`[out:json][timeout:10];nwr(around:40,${lat},${lng})["name"];out center tags 30;`, 15000)
    ]);
    if (nom.status === 'rejected' && ov.status === 'rejected') throw new Error('查詢失敗');
    const names = [], seen = new Set();
    const add = (label, value) => { if (value && !seen.has(value)) { seen.add(value); names.push({ label, value }); } };
    let addr = '', hours = '';
    if (nom.status === 'fulfilled' && nom.value) {
      const r = nom.value, a = r.address || {}, nd = r.namedetails || {};
      add('🏪 地點｜' + (r.name || nd.name || nd['name:zh']), r.name || nd.name || nd['name:zh']);
      if (r.extratags && r.extratags.opening_hours) hours = r.extratags.opening_hours;
      const road = a.road ? a.road + houseNo(a.house_number) : '';
      addr = [a.city || a.county || a.state, a.city_district || a.suburb || a.town, road].filter(Boolean).join('') || '';
      if (!addr && r.display_name) addr = r.display_name;
      if (ov.status === 'fulfilled') {
        ov.value.map(e => this.toPlace(e)).filter(Boolean).map(p => ({ ...p, dist: hav(ctr, p) })).sort((x, y) => x.dist - y.dist).slice(0, 6).forEach((p, i) => {
          const ty = p.tags.amenity || p.tags.shop || p.tags.tourism || p.tags.leisure || '';
          add(`🏬 附近｜${p.name}${ty ? '（' + ty + '）' : ''} ${fmtDist(p.dist)}`, p.name);
          if (i === 0 && p.dist < 30) { if (!hours && p.hours) hours = p.hours; if (!a.house_number && p.addr && addr.length < p.addr.length) addr = p.addr; }
        });
      }
      add('🛣️ 路名｜' + road, road);
      add('🏘️ 里／社區｜' + (a.neighbourhood || a.village || ''), a.neighbourhood || a.village);
      add('🏙️ 行政區｜' + (a.city_district || a.suburb || a.town || a.county || ''), a.city_district || a.suburb || a.town || a.county);
      add('🌆 城市｜' + (a.city || a.state || ''), a.city || a.state);
    } else if (ov.status === 'fulfilled') {
      ov.value.map(e => this.toPlace(e)).filter(Boolean).map(p => ({ ...p, dist: hav(ctr, p) })).sort((x, y) => x.dist - y.dist).slice(0, 6)
        .forEach(p => { add(`🏬 附近｜${p.name} ${fmtDist(p.dist)}`, p.name); if (!hours && p.hours && p.dist < 30) hours = p.hours; });
    }
    return { names, addr, hours };
  }
};

/* ---------------- 營業時間編輯器（週一～週日勾選 + 起迄時間） ---------------- */
const DAYS = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];
function hoursText(days) {   // 連續且時段相同的日子合併成一句
  const lab = d => d.on ? ((d.s || d.e) ? `${d.s || ''}-${d.e || ''}` : '營業') : '公休';
  const out = []; let i = 0;
  while (i < 7) {
    let j = i; const t = lab(days[i]);
    while (j + 1 < 7 && lab(days[j + 1]) === t) j++;
    out.push((j > i ? `${DAYS[i]}至${DAYS[j]}` : DAYS[i]) + (t === '公休' ? '公休' : ' ' + t));
    i = j + 1;
  }
  return out.join('；');
}
function hoursEditorHTML(m) {
  const days = (m.hoursData && m.hoursData.days) || [];
  const note = m.hoursData ? (m.hoursNote || '') : (m.hours || '');
  const rows = DAYS.map((n, i) => { const r = days[i] || {};
    return `<div class="hr"><label class="hd"><input type="checkbox" name="hon${i}" ${r.on ? 'checked' : ''}> ${n}</label><input type="time" name="hs${i}" value="${esc(r.s || '')}"><span>–</span><input type="time" name="he${i}" value="${esc(r.e || '')}"></div>`; }).join('');
  return `<div class="hrsbox"><div class="muted" style="margin-bottom:6px">🕒 營業時間（店家／公開場所，選填）。先填「週一」的起迄時間，其他有勾選的營業日會自動帶入相同時間，不同的再手動改；沒勾選＝公休。</div>
    <div class="row" style="margin-bottom:6px"><button type="button" data-a="h-all">每天</button><button type="button" data-a="h-wk">週一至週五</button><button type="button" data-a="h-none">全不選</button></div>
    ${rows}<label style="margin:6px 0 0">補充／原始文字（如 24 小時、國定假日公休、OSM 資料；選填）<input name="hnote" maxlength="120" value="${esc(note)}"></label></div>`;
}

}
function buildForm(o) {

    <label>筆記<textarea name="note" rows="3" placeholder="個人心得、停車資訊…">${esc(m.note || '')}</textarea></label>

      <label>緯度<input name="lat" required inputmode="decimal" value="${o.lat ?? m.lat ?? ''}" placeholder="25.033964"></label>

    </div>

      ${o.onCancel ? '<button type="button" data-a="cancel">取消</button>' : ''}

  // 貼上「25.03, 121.56」到緯度欄時自動拆開
  f.lat.addEventListener('input', () => {

    if (p && /[,，\s]/.test(f.lat.value.trim())) { f.lat.value = p[0]; f.lng.value = p[1]; }
  });
  f.addEventListener('click', e => {

    if (a === 'cancel') o.onCancel();
    if (a === 'geo') runSuggest(f);
    if (a === 'h-all' || a === 'h-wk' || a === 'h-none') {
      for (let i = 0; i < 7; i++) { const on = a === 'h-all' || (a === 'h-wk' && i < 5); hrow(i).on.checked = on; if (on && i > 0) fillFromMaster(i); }

    const hd = DAYS.map((_, i) => ({ on: f.elements['hon' + i].checked, s: f.elements['hs' + i].value, e: f.elements['he' + i].value }));
    const anyOn = hd.some(d => d.on), hnote = f.elements.hnote.value.trim();
    const hours = [anyOn ? hoursText(hd) : '', hnote].filter(Boolean).join('；');
    o.onSubmit({ name: f.elements.name.value.trim() || '未命名', catId: f.cat.value, rating: +f.rating.value, note: f.note.value.trim(), addr: f.addr.value.trim(),
      hours, hoursData: anyOn ? { days: hd } : null, hoursNote: hnote, speedLimit: Math.max(0, parseInt(f.elements.limit.value) || 0), lat, lng });
  });
  // 營業時間：週一是「主時段」，其他勾選的日子自動貼上；手動改過的日子（dirty）不會再被覆蓋
  const hrow = i => ({ on: f.elements['hon' + i], s: f.elements['hs' + i], e: f.elements['he' + i] });
  const fillFromMaster = i => {
    const r = hrow(i), m0 = hrow(0);
    if (!r.s.value && !r.s.dataset.dirty) r.s.value = m0.s.value;
    if (!r.e.value && !r.e.dataset.dirty) r.e.value = m0.e.value;
  };
  for (let i = 1; i < 7; i++) {   // 編輯舊資料：與週一不同的時段視為「手動調整過」
    const r = hrow(i), m0 = hrow(0);
    if (r.s.value && r.s.value !== m0.s.value) r.s.dataset.dirty = '1';
    if (r.e.value && r.e.value !== m0.e.value) r.e.dataset.dirty = '1';
  }
  f.addEventListener('input', e => {
    const mt = (e.target.name || '').match(/^h([se])(\d)$/); if (!mt) return;
    if (mt[2] === '0') {
      for (let i = 1; i < 7; i++) { const r = hrow(i); if (!r.s.dataset.dirty) r.s.value = hrow(0).s.value; if (!r.e.dataset.dirty) r.e.value = hrow(0).e.value; }
    } else e.target.dataset.dirty = '1';
  });
  f.addEventListener('change', e => {
    const mt = (e.target.name || '').match(/^hon(\d)$/);

  f.addEventListener('change', e => {
    if (e.target.name !== 'sg') return;
    const s = e.target, i = s.value;

  });
  async function runSuggest(form) {
    const sel = form.querySelector('[name=sg]');
    const lat = parseFloat(form.lat.value), lng = parseFloat(form.lng.value);
    if (!isFinite(lat) || !isFinite(lng)) return toast('請先填入座標');
    const tok = form._tok = (form._tok || 0) + 1;
    sel.innerHTML = '<option value="">⏳ 查詢附近地名中…</option>';
    try {
      const r = await Geo.suggest(lat, lng);
      if (form._tok !== tok || !form.isConnected) return;
      sel._names = r.names;
      sel.innerHTML = `<option value="">— 選擇建議名稱（共 ${r.names.length} 項）—</option>` + r.names.map((n, i) => `<option value="${i}">${esc(n.label)}</option>`).join('');
      const nm = form.elements.name;
      if (!nm.value && r.names[0]) { nm.value = r.names[0].value; sel.value = '0'; }
      if (r.addr && !form.addr.value) form.addr.value = r.addr;
      const anyOn = DAYS.some((_, i) => form.elements['hon' + i].checked);
      if (r.hours && !anyOn && !form.elements.hnote.value) form.elements.hnote.value = r.hours;
      if (!r.names.length) sel.innerHTML = '<option value="">（此處查無地名，可手動輸入）</option>';
    } catch (e) {
      if (form.isConnected) sel.innerHTML = '<option value="">（查詢失敗或逾時，可手動輸入或再按「查詢地名」）</option>';
    }
  }
  if (o.suggest) runSuggest(f);
  return f;
}

/* ---------------- 地址搜尋（查詢分頁與路線起終點共用）----------------
 * 流程：Nominatim 原文 → 結構化改寫（路名＋門牌＋行政區，台↔臺）→ Photon（第二資料來源）。
 * 有門牌時，必須結果地址含該門牌才算「相符」，否則繼續嘗試並標示「門牌未確認」。 */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function parseTwAddr(v) {
  let s = String(v).replace(/[\s,，]+/g, '').replace(/臺/g, '台'), m; const o = {};
  if ((m = s.match(/^(.{2,3}?[市縣])/))) { o.city = m[1]; s = s.slice(m[0].length); }
  if ((m = s.match(/^(.{1,3}?[區鄉鎮市])/))) { o.dist = m[1]; s = s.slice(m[0].length); }
  if ((m = s.match(/^(.+?(?:路|街|大道))((?:[一二三四五六七八九十]+|\d+)段)?/))) { o.road = m[1]; o.sec = m[2] || ''; s = s.slice(m[0].length); }
  if ((m = s.match(/(\d+(?:[-之]\d+)?)號/))) o.no = m[1].replace('之', '-');
  return o;
}
const houseHit = (r, no) => new RegExp('(^|[^0-9])' + String(no).replace('-', '[-之]') + '(號|[,，\\s]|$)').test(r.addr || '');

  const out = [v], add = x => { x = (x || '').replace(/\s+/g, ' ').trim(); if (x && !out.includes(x)) out.push(x); };
  const tw = x => x.replace(/台/g, '臺'), tt = x => x.replace(/臺/g, '台');
  if (pa.road) {
    const rd = pa.road + (pa.sec || ''), no = pa.no, d = pa.dist || '', c = pa.city || '';
    if (no) { add(`${rd} ${no}號 ${d}`); add(`${rd} ${no} ${d}`); add(`${no} ${rd} ${d} ${c}`); add(`${rd} ${no}號`); add(`${rd} ${no}`); }
    add(`${rd} ${d} ${c}`); add(`${rd} ${c}`); add(rd);
  }
  add(tw(v)); add(tt(v));
  const noFloor = v.replace(/[\d一二三四五六七八九十]+\s*[樓Ff](之\d+)?.*$/, ''), noNo = noFloor.replace(/[\d-]+\s*(之[\d-]+)?\s*號.*$/, '').replace(/[\d-]+$/, '');
  add(noFloor); add(noNo); add(tw(noNo));
  const parts = v.split(/[\s,，、]+/).filter(Boolean);
  if (parts.length > 1) { add(parts[0]); add(parts.slice(0, 2).join(' ')); }
  if (v.length >= 5) add(v.slice(0, -1));
  return out.slice(0, 11);
}
async function photonSearch(q, sc) {
  const { cc, box } = scopeParams(sc), ref = App.me || map.getCenter();
  const j = await Geo.json(`https://photon.komoot.io/api/?limit=8&q=${encodeURIComponent(q)}&lat=${ref.lat}&lon=${ref.lng}`);
  const lo = box ? Math.min(box[0], box[2]) : -180, hi = box ? Math.max(box[0], box[2]) : 180, sa = box ? Math.min(box[1], box[3]) : -90, na = box ? Math.max(box[1], box[3]) : 90;
  return ((j && j.features) || []).filter(f => (!cc || (f.properties.countrycode || '').toLowerCase() === cc.toLowerCase())
      && f.geometry.coordinates[0] >= lo && f.geometry.coordinates[0] <= hi && f.geometry.coordinates[1] >= sa && f.geometry.coordinates[1] <= na)
    .map(f => { const p = f.properties; return { name: p.name || [p.street, p.housenumber].filter(Boolean).join(' ') || q,
      addr: [p.housenumber, p.street, p.district, p.city, p.state, p.country].filter(Boolean).join(', '), lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] }; });
}
async function addrSearch(v, sc, progress) {
  progress = progress || (() => {});
  const { cc, box } = scopeParams(sc), ref = App.me || map.getCenter();
  const nom = async text => {
    const b = map.getBounds();
    let url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&addressdetails=1&accept-language=zh-TW,zh,en&q=${encodeURIComponent(text)}`;
    if (cc) url += '&countrycodes=' + cc;
    if (box) url += `&viewbox=${box[0]},${box[1]},${box[2]},${box[3]}&bounded=1`; else url += `&viewbox=${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}`;
    const j = await Geo.json(url);
    return j.map(r => ({ name: String(r.name || r.display_name.split(',')[0]).trim(), addr: r.display_name, lat: +r.lat, lng: +r.lon }));
  };
  const pa = parseTwAddr(v), wantNo = !!(pa.no && (pa.road || pa.dist));
  const hit = r => wantNo && houseHit(r, pa.no);
  let list = [], fuzzy = false;
  const merge = more => { for (const r of more) if (!list.some(x => Math.abs(x.lat - r.lat) < 1e-4 && Math.abs(x.lng - r.lng) < 1e-4)) list.push(r); };
  const done = () => list.length > 0 && (!wantNo || list.some(hit));
  merge(await nom(v));
  if (!done()) {
    const vs = addrVariants(v, pa).slice(1);
    for (let i = 0; i < vs.length && !done(); i++) {   // Nominatim 限制約每秒 1 次，故間隔 1.1 秒
      progress(`🔍 ${list.length ? '門牌尚未確認' : '查無完全相符'}，模糊比對中…（${i + 1}/${vs.length}）`);
      await sleep(1100);

      if (list.length && !wantNo) break;
    }
  }
  if (!done()) {

      for (const q of qs) { merge(await photonSearch(q, sc)); if (done()) break; }
      if (list.length) fuzzy = true;
    } catch (e) {}
  }
  list = list.map(r => ({ ...r, hit: wantNo ? !!hit(r) : null, dist: hav(ref, r) }));
  list.sort((a, b) => ((b.hit === true) - (a.hit === true)) || a.dist - b.dist);

    /* 選擇起終點：GPS／地圖點選／常用地點／已存標記／搜尋 */

      qs.textContent = '⏳ 查詢中…';

    };

    chBox.addEventListener('keydown', e => { if (e.target.id === 'rQ' && e.key === 'Enter') searchNom(); });

    /* 顯示路線 */
    const clearDraw = () => { lineLayer.clearLayers(); camLayer.clearLayers(); stepLayer.clearLayers(); sum.innerHTML = ''; camBox.innerHTML = ''; stepsBox.innerHTML = ''; };
    const showRoute = fit => {
      clearDraw();
      const r = R.route; if (!r) return;
      L.polyline(r.geometry, { color: '#fff', weight: 9, opacity: .9, interactive: false }).addTo(lineLayer);
      L.polyline(r.geometry, { color: '#2563eb', weight: 5, opacity: .95, interactive: false }).addTo(lineLayer);
      const dep = departDate(), drv = R.profile === 'driving', adj = adjustDuration(r, dep, R.holiday), sec = drv ? adj.sec : r.duration;
      const eta = new Date(dep.getTime() + sec * 1000);
      sum.innerHTML = `<div class="hrsbox"><div style="font-size:17px"><b>${fmtDist(r.distance)}</b>　約 <b>${fmtDur(sec)}</b></div>
        <div class="muted">${esc(Router.PROFILES[R.profile].label)}｜${fmtHM(dep)} 出發 → 預計 ${fmtHM(eta)} 到達${eta.toDateString() !== dep.toDateString() ? '（隔天）' : ''}</div>
        ${drv ? `<div class="muted">時段：${esc(adj.label)}（係數 ×${adj.factor.toFixed(2)}）｜路網基礎時間 ${fmtDur(r.duration)}</div>
        <div class="muted">⚠️ 係數是依經驗推估的時段加權，不是即時或歷史路況；連假、事故、天氣可能與實際有落差。</div>` : '<div class="muted">步行／自行車依一般速度估算，不受平假日影響。</div>'}
        <div class="row" style="margin-top:8px"><button type="button" class="primary" data-a="save">💾 儲存路線</button><button type="button" data-a="redo">🔄 重新規劃</button></div>
        <div class="muted" style="margin-top:8px">📤 開啟或分享給其他地圖 App（Google／Apple 會用自己的演算法重算路線，起終點與中途點會帶過去）</div>
        <label style="margin:6px 0 0">地點傳給地圖 App 的方式<select id="rShareMode"><option value="text" ${Store.state.settings.shareMode !== 'coord' ? 'selected' : ''}>店名／地址（有的話；讓 Google 自己找到那間店）</option><option value="coord" ${Store.state.settings.shareMode === 'coord' ? 'selected' : ''}>座標（精確位置，但 Google 可能標成附近的別間店）</option></select></label>
        <div class="row" style="margin-top:4px"><button type="button" data-a="gmap">🗺️ Google 地圖</button><button type="button" data-a="amap">🍎 Apple 地圖</button><button type="button" data-a="share">📤 分享</button><button type="button" data-a="copy">📋 複製連結</button></div></div>`;
      if (R.lastShown !== r) { R.lastShown = r; R.said = new Set(); R.metric = routeMetric(r.geometry); }
      drawCams(r); drawSteps(r); renderRem();
      if (fit) map.fitBounds(L.latLngBounds(r.geometry), { padding: [30, 30] });
    };
    const drawCams = r => {
      R.camList = [];
      const list = camsAlong(r.geometry, 50); R.camList = list;
      const total = Store.state.markers.filter(m => m.speedLimit > 0 || m.catId === 'speedcam').length;
      if (!list.length) {
        camBox.innerHTML = `<div class="muted" style="margin-bottom:8px">📸 ${total ? '沿途 50 m 內沒有已存的測速照相。' : '你的資料裡還沒有測速照相；到「更多 → 匯入」匯入測速執法設置點後，這裡會自動標示沿途測速。'}</div>`;
        return;
      }
      list.forEach(x => L.circleMarker([x.m.lat, x.m.lng], { radius: 9, color: '#e11d48', weight: 3, fillColor: '#fff', fillOpacity: .5, interactive: false }).addTo(camLayer));
      camBox.innerHTML = `<div class="hrsbox"><b>📸 沿途 ${list.length} 處測速照相</b><span class="muted">（路線兩側 50 m 內，依行進順序；方向請以現場標示為準）</span>
        <ul class="items">${list.map(x => `<li data-id="${esc(x.m.id)}"><span class="ic">📸</span><div><div class="t">${esc(x.m.name)}</div>
        <div class="muted">${x.m.speedLimit ? `🚦 速限 ${x.m.speedLimit} km/h｜` : ''}距起點約 ${fmtDist(x.at)}${x.m.dir ? '｜' + esc(x.m.dir) : ''}</div></div></li>`).join('')}</ul></div>`;
    };
    let stepList = [];
    const drawSteps = r => {
      const lastLeg = R.pts.length - 2;
      stepList = r.steps || [];
      if (!stepList.length) { stepsBox.innerHTML = '<div class="muted" style="margin-bottom:8px">🧾 儲存的路線不含轉彎指引，按「🔄 重新規劃」即可取得。</div>'; return; }
      stepsBox.innerHTML = `<details class="hrsbox"><summary><b>🧾 轉彎指引</b>（${stepList.length} 步，點一步會飛到該路口）</summary><ul class="items">${stepList.map((s, k) => {
        const x = stepInfo(s, lastLeg, letter(s.leg + 1));
        return `<li data-k="${k}"><span class="ic">${x.ic}</span><div><div class="t" style="font-weight:500">${esc(x.t)}</div>${s.type !== 'arrive' && s.dist > 0 ? `<div class="muted">接著 ${fmtDist(s.dist)}，約 ${fmtDur(s.dur)}</div>` : ''}</div></li>`; }).join('')}</ul></details>`;
    };
    stepsBox.onclick = e => {
      const li = e.target.closest('li[data-k]'); if (!li) return;
      const s = stepList[+li.dataset.k]; if (!s) return;
      stepLayer.clearLayers();
      L.circleMarker(s.loc, { radius: 11, color: '#fff', weight: 3, fillColor: '#f59e0b', fillOpacity: 1, interactive: false }).addTo(stepLayer);
      map.flyTo(s.loc, Math.max(map.getZoom(), 18));
    };
    camBox.onclick = e => { const li = e.target.closest('li[data-id]'); if (li) Markers.focus(li.dataset.id); };
    const departDate = () => { if (R.when === 'set' && R.dt) { const d = new Date(R.dt); if (!isNaN(d)) return d; } return new Date(); };
    const whenSel = $('#rWhen', el), dtIn = $('#rDt', el), holIn = $('#rHol', el);
    const rerender = () => { if (R.route) showRoute(false); };
    whenSel.onchange = () => {
      R.when = whenSel.value; dtIn.style.display = R.when === 'set' ? '' : 'none';
      if (R.when === 'set' && !dtIn.value) { const n = new Date(); dtIn.value = `${n.getFullYear()}-${pad2(n.getMonth() + 1)}-${pad2(n.getDate())}T${pad2(n.getHours())}:${pad2(n.getMinutes())}`; R.dt = dtIn.value; }
      rerender();
    };
    dtIn.onchange = () => { R.dt = dtIn.value; rerender(); };
    holIn.onchange = () => { R.holiday = holIn.checked; rerender(); };
    /* 分享／開啟其他地圖 App */
    const mapLinks = explicit => {
      const pt = R.pts, ll = x => `${(+x.lat).toFixed(6)},${(+x.lng).toFixed(6)}`, last = pt[pt.length - 1], mid = pt.slice(1, -1);
      const byText = Store.state.settings.shareMode !== 'coord';   // 預設：有店名／地址的點，用文字讓 Google 自己找到那間店；否則用座標
      const place = x => {
        if (byText && x.named && (x.addr || x.name)) return encodeURIComponent(x.addr && x.name && x.addr.includes(x.name) ? x.addr : [x.name, x.addr].filter(Boolean).join(' '));
        return ll(x);
      };
      const live = !explicit && pt[0].name === '目前位置';   // 自己開啟時，起點省略＝由地圖 App 使用即時位置；傳給別人時一定帶座標
      let g = 'https://www.google.com/maps/dir/?api=1' + (live ? '' : '&origin=' + place(pt[0])) + '&destination=' + place(last) + '&travelmode=' + { driving: 'driving', cycling: 'bicycling', walking: 'walking' }[R.profile];
      if (mid.length) g += '&waypoints=' + mid.map(place).join('%7C');
      const a = 'https://maps.apple.com/?' + (live ? '' : 'saddr=' + place(pt[0]) + '&') + 'daddr=' + [...mid, last].map(place).join('+to:') + '&dirflg=' + { driving: 'd', cycling: 'b', walking: 'w' }[R.profile];
      return { g, a };
    };
    const shareBlock = () => {
      const pt = R.pts, L2 = mapLinks(true), r = R.route, dep = departDate(), sec = R.profile === 'driving' ? adjustDuration(r, dep, R.holiday).sec : r.duration;
      return { title: `路線：${pt[0].name} → ${pt[pt.length - 1].name}`, text: `🧭 ${pt[0].name} → ${pt[pt.length - 1].name}\n${Router.PROFILES[R.profile].label}｜${fmtDist(r.distance)}｜約 ${fmtDur(sec)}\nGoogle 地圖：${L2.g}\nApple 地圖：${L2.a}\n📍 終點精確位置（釘選點）：${gLink(pt[pt.length - 1].lat, pt[pt.length - 1].lng)}` };
    };
    sum.onchange = e => { if (e.target.id === 'rShareMode') { Store.state.settings.shareMode = e.target.value; Store.save(); toast('✓ 已自動儲存', 1200); } };
    sum.onclick = e => {
      const a = e.target.dataset.a; if (!a) return;
      if (a === 'redo') plan();
      else if (a === 'save') saveRoute();
      else if (!R.route || R.pts.some(x => !x)) return;
      else if (a === 'gmap') window.open(mapLinks(false).g, '_blank', 'noopener');
      else if (a === 'amap') window.open(mapLinks(false).a, '_blank', 'noopener');
      else if (a === 'share') shareText(shareBlock());
      else if (a === 'copy') copyText(shareBlock().text);
    };
    /* 測速提醒：行駛中以 GPS 判斷路線上前方的測速照相，靠近時警示 */
    const Rem = { id: null, wake: null, ctx: null, hide: null };
    const remBox = $('#rRem', el);
    const remSt = t => { R.remText = t; const x = $('#rRemSt', remBox); if (x) x.textContent = t; };
    const alertEl = () => { let d = $('#camAlert'); if (!d) { d = document.createElement('div'); d.id = 'camAlert'; document.body.appendChild(d); } return d; };
    const hideAlert = () => { const d = $('#camAlert'); if (d) d.style.display = 'none'; };
    const beep = () => { try { const c = Rem.ctx; if (!c) return; const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = .25; o.connect(g); g.connect(c.destination); o.start(); setTimeout(() => o.stop(), 300); } catch (e) {} };
    const speak = t => { try { const u = new SpeechSynthesisUtterance(t); u.lang = 'zh-TW'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} };
    const fire = (x, ahead) => {
      const d = Math.max(50, Math.round(ahead / 50) * 50), txt = `前方 ${d} 公尺有測速照相${x.m.speedLimit ? '，速限 ' + x.m.speedLimit : ''}`;
      const al = alertEl(); al.textContent = '📸 ' + txt; al.style.display = 'block';
      clearTimeout(Rem.hide); Rem.hide = setTimeout(hideAlert, 8000);
      if (navigator.vibrate) { try { navigator.vibrate([250, 120, 250]); } catch (e) {} }
      beep(); speak(txt);
    };
    const onPos = p => {
      const me = { lat: p.coords.latitude, lng: p.coords.longitude }; App.me = { ...me, acc: p.coords.accuracy };
      if (!R.route || !R.metric) return;
      const pr = projectOnRoute(R.route.geometry, R.metric, me);
      if (pr.off > 200) { remSt(`⚠️ 你目前離開規劃路線約 ${Math.round(pr.off)} 公尺，暫停提醒（回到路線後自動恢復）`); return; }
      const sp = p.coords.speed > 0 ? p.coords.speed : 0, far = Math.max(500, sp * 25), near = Math.max(200, sp * 10);
      let next = null;
      for (const x of R.camList) {
        const ahead = x.at - pr.at; if (ahead < -30) continue;
        if (!next || ahead < next.ahead) next = { x, ahead };
        const id = x.m.id;
        if (ahead <= near && !R.said.has(id + 'n')) { R.said.add(id + 'n'); R.said.add(id + 'f'); fire(x, ahead); }
        else if (ahead <= far && ahead > near && !R.said.has(id + 'f')) { R.said.add(id + 'f'); fire(x, ahead); }
      }
      remSt(next ? `🔔 提醒中｜下一處：${next.x.m.name}，前方 ${fmtDist(Math.max(0, next.ahead))}${next.x.m.speedLimit ? '，速限 ' + next.x.m.speedLimit : ''}` : '🔔 提醒中｜前方路線上已沒有測速照相');
    };
    const stopRem = () => {
      if (Rem.id != null) { try { navigator.geolocation.clearWatch(Rem.id); } catch (e) {} Rem.id = null; }
      if (Rem.wake) { try { Rem.wake.release(); } catch (e) {} Rem.wake = null; }
      hideAlert(); R.remText = ''; renderRem();
    };
    const startRem = () => {
      if (!navigator.geolocation) return toast('此瀏覽器不支援定位');
      R.said = new Set();
      try { Rem.ctx = Rem.ctx || new (window.AudioContext || window.webkitAudioContext)(); Rem.ctx.resume(); } catch (e) {}
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}   // 在使用者手勢內先解鎖語音（iOS 需要）
      try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { Rem.wake = w; }).catch(() => {}); } catch (e) {}
      R.remText = '📡 取得定位中…';
      Rem.id = navigator.geolocation.watchPosition(onPos, e => remSt('❌ 定位失敗：' + (e.message || '請允許定位權限')), { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
      renderRem();
    };
    function renderRem() {
      if (!R.camList.length) { remBox.innerHTML = ''; if (Rem.id != null) stopRem(); return; }
      const on = Rem.id != null, lims = [...new Set(R.camList.map(x => x.m.speedLimit).filter(Boolean))].sort((a, b) => a - b);
      remBox.innerHTML = `<div class="hrsbox"><b>⚠️ 此路線經過 ${R.camList.length} 處測速照相</b>${lims.length ? `<span class="muted">（速限 ${lims.join('、')} km/h）</span>` : ''}
        <div class="row" style="margin:6px 0"><button type="button" class="${on ? 'danger' : 'primary'}" data-a="rem">${on ? '⏹ 停止測速提醒' : '🔔 開始測速提醒（行進中使用）'}</button></div>
        <div class="muted" id="rRemSt">${esc(R.remText)}</div>
        <div class="muted">靠近前方測速照相時會跳出警示、震動、語音與提示音。需保持此網頁在前景、螢幕不鎖定；手機切到別的 App 或鎖屏後，瀏覽器通常會停止定位。提醒僅供參考，請依現場標誌與速限行駛，行車中請勿操作手機。</div></div>`;
    }
    remBox.onclick = e => { if (e.target.dataset.a === 'rem') { Rem.id != null ? stopRem() : startRem(); } };

    /* 規劃 */
    const plan = async () => {
      const pts = R.pts;
      if (pts.length < 2 || pts.some(p => !p)) { R.tok++; R.route = null; clearDraw(); st.textContent = ''; return; }
      if (hav(pts[0], pts[pts.length - 1]) < 5 && pts.length === 2) { R.tok++; R.route = null; clearDraw(); st.textContent = '起點與終點相同，請換一個地點'; return; }
      const tok = ++R.tok; st.textContent = '⏳ 規劃路線中…';
      try {
        const r = await Router.route(R.profile, pts);
        if (tok !== R.tok) return;
        R.route = r; st.textContent = ''; showRoute(true);
      } catch (e) { if (tok !== R.tok) return; R.route = null; clearDraw(); st.textContent = '❌ ' + e.message; }
    };

    $('#rSwap', el).onclick = () => { R.pts.reverse(); drawPts(); plan(); };
    $('#rClear', el).onclick = () => { stopRem(); R.tok++; R.pts = [null, null]; R.route = null; chI = -1; renderCh(); clearDraw(); drawPts(); st.textContent = ''; };

    /* 儲存路線 */
    const r5 = n => Math.round(n * 1e5) / 1e5;
    const saveRoute = () => {
      if (!R.route) return;
      const p = R.pts, def = `${p[0].name} → ${p[p.length - 1].name}`;
      const name = prompt('路線名稱', def); if (name === null) return;
      Store.state.routes.unshift({
        id: uid(), name: name.trim() || def, profile: R.profile,
        waypoints: p.map(x => ({ lat: x.lat, lng: x.lng, name: x.name })),
        geometry: R.route.geometry.map(g => [r5(g[0]), r5(g[1])]),
        distance: R.route.distance, duration: R.route.duration, createdAt: Date.now()
      });
      Store.save(); Bus.emit('data:changed'); toast('已儲存路線');
    };
    const saved = $('#rSaved', el);
    saved.onclick = e => {
      const li = e.target.closest('li[data-id]'); if (!li) return;
      const rt = Store.state.routes.find(x => x.id === li.dataset.id); if (!rt) return;
      const a = e.target.dataset.a;
      if (a === 'del') { if (confirm(`刪除路線「${rt.name}」？`)) { Store.state.routes = Store.state.routes.filter(x => x.id !== rt.id); Store.save(); Bus.emit('data:changed'); } }
      else if (a === 'ren') { const n = prompt('路線名稱', rt.name); if (n && n.trim()) { rt.name = n.trim(); Store.save(); Bus.emit('data:changed'); } }
      else {
        R.tok++; R.profile = Router.PROFILES[rt.profile] ? rt.profile : 'driving'; markProf();
        R.pts = rt.waypoints.map(w => ({ lat: w.lat, lng: w.lng, name: w.name || '' }));
        R.route = { geometry: rt.geometry, distance: rt.distance, duration: rt.duration, steps: [] };
        chI = -1; renderCh(); drawPts(); st.textContent = ''; showRoute(true);
      }
    };
    this.refresh = () => {
      saved.innerHTML = Store.state.routes.map(r => `<li class="wrap" data-id="${esc(r.id)}"><span class="ic">🧭</span>
        <div style="flex:1;min-width:0"><div class="t">${esc(r.name)}</div><div class="muted">${esc((Router.PROFILES[r.profile] || {}).label || '')}｜${fmtDist(r.distance)}｜${fmtDur(r.duration)}｜${fmtDate(r.createdAt)}</div></div>
        <div class="btns"><button type="button" data-a="show">顯示</button><button type="button" data-a="ren">改名</button><button type="button" class="danger" data-a="del">刪除</button></div></li>`).join('')
        || '<li class="muted" style="cursor:default">還沒有儲存的路線。</li>';
    };
    this.refresh(); drawPts();

    /* 標記彈窗／查詢結果的「導航」：以目前 GPS 為起點、指定地點為終點 */
    Hooks.navigateTo = async m => {
      map.closePopup();
      if (document.body.classList.contains('side-closed')) { document.body.classList.remove('side-closed'); setTimeout(() => map.invalidateSize(), 50); }
      UI.show('route');
      stopRem(); R.tok++; R.route = null; clearDraw(); chI = -1; renderCh();
      R.pts = [null, { lat: m.lat, lng: m.lng, name: m.name || `${(+m.lat).toFixed(5)}, ${(+m.lng).toFixed(5)}`, ref: m.id || '', addr: m.addr || '', named: m.named !== undefined ? !!m.named : !!m.id }];
      drawPts(); st.textContent = '📡 取得目前位置…';
      try {
        const p = await App.getLocation();
        R.pts[0] = { lat: p.lat, lng: p.lng, name: '目前位置' }; st.textContent = ''; drawPts(); plan();
      } catch (e) { st.textContent = '❌ ' + e.message + '。請手動選擇起點。'; openCh(0); }
    };
  }
});

/* --- 匯入器：CSV / JSON / GeoJSON --- */
const Importer = {
  A: {
    lat: ['lat', 'latitude', '緯度', 'y', 'wgs84ay'],
    lng: ['lng', 'lon', 'long', 'longitude', '經度', 'x', 'wgs84ax'],
    name: ['name', '名稱', '店名', '站名', '分店名稱', '門市名稱', '分店名', '加油站名稱', '據點名稱', '店家', 'title', 'label'],
    addr: ['address', 'addr', '地址', '門市地址', '店址', '詳細地址', '地點', '設置地點', '設置地址', '設置位置', '位置', '路口', '路段'],
    hours: ['hours', 'opening_hours', '營業時間', '服務時間'],
    note: ['note', 'notes', '備註', '說明', 'description', 'memo'],
    cat: ['category', '分類', '類別', 'type', '類型'],
    rating: ['rating', '評分'],
    city: ['cityname', 'city', 'county', '縣市名稱', '縣市', '縣市別', '所在縣市'],
    region: ['regionname', 'district', '區域名稱', '區域', '鄉鎮市區', '行政區', '鄉鎮'],
    limit: ['limit', 'speedlimit', 'speed_limit', '速限', '速限(km/h)', '限速', '最高速限', '速限值'],
    dir: ['direct', 'direction', '拍攝方向', '方向', '行向']
  },
  CITY_RE: /^(臺北市|台北市|新北市|基隆市|桃園市|新竹市|新竹縣|苗栗縣|臺中市|台中市|彰化縣|南投縣|雲林縣|嘉義市|嘉義縣|臺南市|台南市|高雄市|屏東縣|宜蘭縣|花蓮縣|臺東縣|台東縣|澎湖縣|金門縣|連江縣)/,
  decode(buf) {
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch (e) { try { return new TextDecoder('big5').decode(buf); } catch (e2) { return new TextDecoder().decode(buf); } }
  },
  parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/, 1)[0];
    const delim = [',', '\t', ';', '|'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
    const rows = []; let row = [], cur = '', inq = false;
    const endRow = () => { row.push(cur); cur = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; };
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inq) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inq = false; } else cur += c; }
      else if (c === '"') inq = true;
      else if (c === delim) { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; endRow(); }
      else cur += c;
    }
    if (cur !== '' || row.length) endRow();
    if (!rows.length) return [];
    const head = rows.shift().map(h => h.trim());
    return rows.map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
  },
  records(text) {
    const t = text.replace(/^﻿/, '').trim();
    if (t[0] === '{' || t[0] === '[') {
      const j = JSON.parse(t);
      if (j && j.type === 'FeatureCollection' && Array.isArray(j.features)) {
        return j.features.map(f => {
          let c = (f.geometry || {}).coordinates;
          while (Array.isArray(c) && Array.isArray(c[0])) c = c[0];
          return { ...(f.properties || {}), lat: c ? c[1] : undefined, lng: c ? c[0] : undefined };
        });
      }
      if (Array.isArray(j)) return j;
      const arr = Object.values(j || {}).find(v => Array.isArray(v) && v.length && typeof v[0] === 'object');
      if (arr) return arr;
      throw new Error('JSON 中找不到清單陣列');
    }
    return this.parseCSV(t);
  },
  pick(r, keys) {
    const low = {}; for (const k in r) low[k.trim().toLowerCase()] = r[k];
    for (const k of keys) { const v = low[k]; if (v !== undefined && v !== null && String(v).trim() !== '') return String(v).trim(); }
    return '';
  },
  norm(r) {
    let lat = parseFloat(this.pick(r, this.A.lat)), lng = parseFloat(this.pick(r, this.A.lng));
    if (!isFinite(lat) || !isFinite(lng)) return null;
    if (Math.abs(lat) > 90 && Math.abs(lng) <= 90) [lat, lng] = [lng, lat];   // 欄位填反時自動對調
    if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    const addr = this.pick(r, this.A.addr);
    return { name: (this.pick(r, this.A.name) || addr || '未命名').slice(0, 80), lat, lng, addr,
      hours: this.pick(r, this.A.hours), note: this.pick(r, this.A.note), catName: this.pick(r, this.A.cat),
      rating: Math.min(5, Math.max(0, parseInt(this.pick(r, this.A.rating)) || 0)),
      city: (this.pick(r, this.A.city) || (addr.match(this.CITY_RE) || [''])[0]).replace(/台/g, '臺'), region: this.pick(r, this.A.region),
      limit: parseInt(this.pick(r, this.A.limit)) || 0, dir: this.pick(r, this.A.dir) };
  }
};

          <label style="margin-top:6px">地址／名稱關鍵字（空白分隔＝符合任一個；留空＝不限）<input id="iKw" placeholder="例：信義 大安"></label>
          <label>只匯入離目前地圖中心 N 公里內（留空＝不限）<input id="iRad" type="number" min="0.1" step="0.1" placeholder="例：10"></label>
          <div id="iCnt" class="muted"></div></div>
        <label style="margin-top:10px">匯入到分類<select id="iCat"><option value="__file__">依檔案「分類」欄位（沒有則放「其他」）</option>${Cats.options('')}<option value="__new__">＋新增分類…</option></select></label>
        <div class="two" id="iNew" style="display:none"><label>新分類名稱<input id="iNn" value="${esc(base)}"></label><label>圖示<input id="iNe" value="📍" maxlength="4"></label></div>
        <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="iDup" checked style="width:auto;margin:0"> 略過重複（同名且座標相近）</label>

      const filtered = () => {

      catch (err) { pv.innerHTML = '<p class="muted">❌ 載入失敗（網址錯誤，或對方網站不允許跨來源存取）。可先下載檔案再用上方「選擇檔案」。</p>'; }
    };
    $('#iSample', el).onclick = e => {
      e.preventDefault();
      const csv = '﻿名稱,緯度,經度,地址,營業時間,分類,備註\n示範加油站,25.0478,121.5170,台北市中正區示範路1號,24 小時營業,加油站,範例資料\n示範全聯,25.0420,121.5075,台北市中正區示範街2號,週一至週日 08:00-22:00,超市,範例資料\n';

  id: 'settings', label: '⚙️ 設定',
  init(el) {
    el.innerHTML = `<p class="muted">✅ 這裡的選項一改就自動儲存，不需按「確定」或「套用」（只有「套用並前往預設位置」是讓地圖立刻跳過去）。</p>
      <label>開啟地圖時顯示的位置
        <select id="sMode"><option value="gps">目前 GPS 定位</option><option value="place">預設常用地點</option><option value="last">上次瀏覽的位置</option></select></label>
      <label>預設常用地點<select id="sPlace"></select></label>
      <label>預設縮放級別：<b id="sZv"></b><input type="range" id="sZ" min="3" max="19"></label>
      <div class="row" style="margin-bottom:12px"><button id="sZcur">使用目前地圖縮放</button><button id="sGo">套用並前往預設位置</button></div>
      <label>附近搜尋預設半徑（公里，0.1～5）<input type="number" id="sR" min="0.1" max="5" step="0.1"></label>
      <div class="hrsbox"><b>🌏 查詢範圍限制（用於「查詢」）</b>
        <div class="muted" style="margin:4px 0 8px">先限制國家，再限制區域，避免搜尋結果跑到別的國家。查無資料時會先模糊比對，再詢問是否擴大範圍。區域邊界為粗略範圍。</div>
        <label>國家<select id="sCtry"></select></label>
        <label>區域<select id="sReg"></select></label></div>
      <label>長按地圖的時間（秒，0.4～2）<input type="number" id="sLp" min="0.4" max="2" step="0.1"></label>
      <label style="display:flex;gap:6px;align-items:center;color:var(--fg)"><input type="checkbox" id="sGeo" style="width:auto;margin:0"> 點擊地圖新增標記時，自動查詢地名（Nominatim）</label>
      <p class="muted">地圖右下角的＋－與滑桿可隨時手動調整縮放。GPS 定位需要 https 或 localhost。</p>`;
    const q = s => $(s, el), S = () => Store.state.settings, save = () => { Store.save(); toast('✓ 已自動儲存', 1200); };
    const mode = q('#sMode'), pl = q('#sPlace'), z = q('#sZ'), zv = q('#sZv'), rr = q('#sR'), geo = q('#sGeo'), lp = q('#sLp');
    const fill = () => {
      pl.innerHTML = '<option value="">— 尚無／未選擇 —</option>' + Store.state.places.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
      pl.value = S().defaultPlaceId || ''; mode.value = S().startMode; z.value = S().defaultZoom; zv.textContent = z.value;
      rr.value = S().searchRadiusKm; geo.checked = S().autoGeocode !== false; lp.value = (S().longPressMs || 700) / 1000;
    };
    mode.onchange = () => { S().startMode = mode.value; save(); };
    pl.onchange = () => { S().defaultPlaceId = pl.value; if (pl.value) { S().startMode = 'place'; mode.value = 'place'; } save(); };
    z.oninput = () => zv.textContent = z.value;
    z.onchange = () => { S().defaultZoom = +z.value; save(); map.setZoom(+z.value); };
    q('#sZcur').onclick = () => { S().defaultZoom = map.getZoom(); save(); fill(); toast(`預設縮放已設為 ${S().defaultZoom}`); };
    q('#sGo').onclick = () => { if (!goDefault(false)) toast('目前設定為「上次位置」，沒有預設位置可前往'); };
    rr.onchange = () => { S().searchRadiusKm = Math.min(5, Math.max(0.1, +rr.value || 2)); save(); fill(); };
    geo.onchange = () => { S().autoGeocode = geo.checked; save(); };
    const cSel = q('#sCtry'), rSel = q('#sReg');
    const fillScope = () => {
      const sc = S().scope || (S().scope = { country: 'tw', region: '' });
      cSel.innerHTML = Object.entries(SCOPES).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('') + '<option value="">不限國家（全世界）</option>';
      cSel.value = sc.country;
      const regs = (SCOPES[sc.country] || {}).regions || {};
      rSel.innerHTML = '<option value="">全境（不限區域）</option>' + Object.entries(regs).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('');
      rSel.value = sc.region;
    };
    cSel.onchange = () => { S().scope = { country: cSel.value, region: '' }; save(); fillScope(); };
    rSel.onchange = () => { S().scope = { country: cSel.value, region: rSel.value }; save(); };
    lp.onchange = () => { S().longPressMs = Math.round(Math.min(2, Math.max(0.4, +lp.value || 0.7)) * 1000); save(); fill(); };
    this.refresh = () => { fill(); fillScope(); }; this.refresh();
  }
});

/* --- 分頁：資料備份 --- */
UI.addTab({
  id: 'data', label: '💾 資料', parent: 'more', hidden: true,
  init(el) {
    el.innerHTML = `<p class="muted">資料會自動存在這個瀏覽器（LocalStorage）。換裝置或清除瀏覽器資料前，請先匯出備份。</p>
      <label>資料名稱（可自行修改；用於匯出檔名與備份檔識別）<input id="dName" maxlength="40"></label>
      <div class="muted" id="dFile" style="margin:-4px 0 8px"></div>
      <div class="row" style="margin-bottom:14px"><button class="primary" id="exp">⬇️ 匯出 JSON</button></div>
      <label>匯入 JSON 檔<input type="file" id="imp" accept="application/json,.json"></label>
      <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ovr" style="width:auto;margin:0"> 覆蓋現有資料（預設為合併，相同 ID 以匯入為準）</label>
      <h4>🧹 移除匯入／附近搜尋加入的標記</h4><div class="muted">依每次匯入或「加入我的標記」分批列出，可整批移除（建議先匯出備份）。</div><ul class="items" id="bat"></ul>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <button class="danger" id="clr">🗑️ 清除全部資料</button>`;
    $('#exp', el).onclick = () => Store.exportJSON();
    const dName = $('#dName', el), dFile = $('#dFile', el);
    const showFile = () => { dFile.textContent = '匯出檔名：' + Store.fileName(); };
    dName.value = Store.state.dataName || '我的地圖'; showFile();
    dName.onchange = () => { Store.state.dataName = dName.value.trim() || '我的地圖'; dName.value = Store.state.dataName; Store.save(); showFile(); };
    const bat = $('#bat', el);
    const drawBat = () => {
      const g = new Map();
      Store.state.markers.forEach(m => {
        let key = '', label = '';
        if (m.batch) { key = 'b:' + m.batch; label = m.batchName || '匯入批次'; }
        else if (m.src === 'import' || m.src === 'osm') { const c = Cats.get(m.catId); key = 's:' + m.src + ':' + m.catId; label = (m.src === 'import' ? '匯入（舊紀錄，依分類）' : '附近搜尋加入（舊紀錄，依分類）') + '：' + c.emoji + ' ' + c.name; }
        if (!key) return;
        const e = g.get(key) || { key, label, ids: [] }; e.ids.push(m.id); g.set(key, e);
      });
      bat._g = g;
      bat.innerHTML = [...g.values()].map(e => `<li class="wrap" data-k="${esc(e.key)}"><div style="flex:1"><div class="t">${esc(e.label)}</div><div class="muted">${e.ids.length} 筆</div></div><div class="btns"><button type="button" data-a="ren">改名</button><button type="button" class="danger" data-a="rm">移除這批</button></div></li>`).join('')
        || '<li class="muted" style="cursor:default">目前沒有匯入或附近搜尋加入的標記。</li>';
    };
    bat.onclick = e => {
      const li = e.target.closest('li[data-k]'); const a = e.target.dataset.a; if (!li || !a) return;
      const grp = bat._g.get(li.dataset.k); if (!grp) return;
      const set = new Set(grp.ids);
      if (a === 'ren') {
        const nn = prompt('資料名稱', grp.label); if (nn === null || !nn.trim()) return;
        const nb = grp.key.startsWith('b:') ? grp.key.slice(2) : 'b_' + uid();
        Store.state.markers.forEach(m => { if (set.has(m.id)) { m.batch = nb; m.batchName = nn.trim(); } });
        Store.save(); Bus.emit('data:changed'); toast('已改名'); return;
      }
      if (!confirm(`移除「${grp.label}」共 ${grp.ids.length} 筆標記？\n此動作無法復原，建議先匯出備份。（你手動編輯過的標記也會一併移除）`)) return;
      Store.state.markers = Store.state.markers.filter(m => !set.has(m.id)); Store.save(); Bus.emit('data:changed'); toast(`已移除 ${set.size} 筆`);
    };
        this.refresh = drawBat; drawBat();
    $('#imp', el).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const n = Store.importJSON(await f.text(), $('#ovr', el).checked);
        toast(`匯入完成（檔內 ${n} 個標記）`);
      } catch (err) { toast('匯入失敗：不是有效的 JSON 備份檔'); }
      e.target.value = '';
    };
    $('#clr', el).onclick = () => {
      if (confirm('確定清除全部標記、分類與路線？此動作無法復原，建議先匯出備份。')) {
        Store.state = Store.fresh(); Store.save(); Bus.emit('data:changed'); toast('已清除');
      }
    };
  }
});

/* --- 分頁：更多（較少用的功能收在這裡） --- */
UI.addTab({
  id: 'more', label: '⋯ 更多',
  init(el) {
    el.innerHTML = `<p class="muted">較少使用的功能收在這裡，避免干擾畫面。</p>
      <ul class="items">
        <li data-go="cats"><span class="ic">🏷️</span><div><div class="t">分類</div><div class="muted">標記清單、搜尋，以及分類圖示／順序編輯</div></div></li>
        <li data-go="import"><span class="ic">📁</span><div><div class="t">匯入</div><div class="muted">匯入 CSV／JSON／GeoJSON（例：加油站、全聯清單）或備份檔</div></div></li>
        <li data-go="data"><span class="ic">💾</span><div><div class="t">資料</div><div class="muted">匯出備份、還原、清除全部資料</div></div></li>
      </ul>`;
    el.onclick = e => { const li = e.target.closest('li[data-go]'); if (li) UI.show(li.dataset.go); };
  }
});

/* ---------------- 右上角按鈕 ---------------- */
const defZoom = () => Store.state.settings.defaultZoom || 15;
let meMarker = null;
async function locateMe(auto) {
  try {
    const p = await App.getLocation();
    if (meMarker) map.removeLayer(meMarker);
    meMarker = L.circleMarker([p.lat, p.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1 }).bindPopup(() => coordPopup('📍 目前位置', p, { acc: p.acc, add: true })).addTo(map);
    if (!auto) toast(`✅ 已定位到你的位置${p.acc ? '（誤差約 ' + Math.round(p.acc) + ' 公尺）' : ''}，點藍點可複製座標`, 3000);
    if (auto) map.setView([p.lat, p.lng], defZoom());
    else map.flyTo([p.lat, p.lng], defZoom());
  } catch (e) { toast(auto ? '無法自動定位，已顯示上次位置' : e.message); }
}
$('#btnLocate').onclick = () => { toast('📡 定位中…', 4000); locateMe(false); };
$('#btnSide').onclick = () => { document.body.classList.toggle('side-closed'); setTimeout(() => map.invalidateSize(), 50); };
addEventListener('resize', () => map.invalidateSize());

/* ---------------- 啟動 ---------------- */
Markers.render();
UI.refresh();
// 縮放滑桿（地圖左下角）
L.control.scale({ position: 'bottomright', imperial: false, maxWidth: 110 }).addTo(map);   // 比例尺（先加，位於最下方）
const ZoomCtl = L.Control.extend({
  onAdd() {
    const d = L.DomUtil.create('div', 'zoombox');
    d.innerHTML = '<button type="button" id="zOut" title="縮小">－</button><input id="zoomRange" type="range" min="2" max="19" step="1"><button type="button" id="zIn" title="放大">＋</button><b id="zoomVal"></b>';
    L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
    return d;
  }
});
new ZoomCtl({ position: 'bottomright' }).addTo(map);
const zr = $('#zoomRange'), zvEl = $('#zoomVal');
const syncZoom = () => { zr.value = map.getZoom(); zvEl.textContent = map.getZoom(); };
zr.oninput = () => map.setZoom(+zr.value);
$('#zOut').onclick = () => map.zoomOut();
$('#zIn').onclick = () => map.zoomIn();
map.on('zoomend', syncZoom); syncZoom();

// 開啟時依設定決定位置：GPS／預設常用地點／上次位置
function goDefault(auto) {
  const s = Store.state.settings;
  if (s.startMode === 'place') {
    const p = Store.state.places.find(x => x.id === s.defaultPlaceId);
    if (p) { auto ? map.setView([p.lat, p.lng], defZoom()) : map.flyTo([p.lat, p.lng], defZoom()); return true; }
    return false;
  }
  if (s.startMode === 'gps') { locateMe(auto); return true; }
  return false;
}
goDefault(true);
</script>
</body>
