<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#fff;--fg:#1f2430;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--danger:#dc2626;--panel:#f8fafc}
@media (prefers-color-scheme:dark){:root{--bg:#161a22;--fg:#e8eaf0;--muted:#9aa3b2;--line:#2b3140;--accent:#60a5fa;--danger:#f87171;--panel:#1d222c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--fg);background:var(--bg)}
#app{display:flex;height:100%}
#map{flex:1;min-width:0;height:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#map .leaflet-popup{-webkit-user-select:text;user-select:text}
#sidebar{width:340px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg);order:-1}
body.side-closed #sidebar{display:none}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}
#tabs button{flex:1 0 auto;border:0;background:none;padding:8px 8px;white-space:nowrap;color:var(--muted);cursor:pointer;font:inherit;border-bottom:2px solid transparent;border-radius:0}
#tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
#panes{flex:1;overflow:auto;padding:12px}
.pane{display:none}.pane.on{display:block}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger)}
label{display:block;margin-bottom:8px;font-size:12px;color:var(--muted)}
label>input,label>select,label>textarea{margin-top:3px;font-size:14px;color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{color:var(--muted);font-size:12px}
.items{list-style:none;margin:8px 0;padding:0}
.items li{display:flex;gap:10px;padding:9px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.items li:hover{background:var(--panel)}
.items .ic{font-size:20px;line-height:1.2}
.items .t{font-weight:600}
.filters{display:grid;grid-template-columns:1fr 130px;gap:8px}
.catrow{display:grid;grid-template-columns:52px 1fr 40px 32px;gap:6px;margin-bottom:6px;align-items:center}
.catrow input[type=color]{padding:0;height:34px}
.pin{background:none;border:0}
dialog{max-height:92vh;overflow:auto}
.zoombox{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--bg);color:var(--fg);border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.zoombox{gap:4px}
.zoombox input{width:104px;padding:0;border:0}
.zoombox b{min-width:22px;text-align:center}
.zoombox button{padding:2px 9px;font-size:18px;line-height:1.2;border:0;background:transparent;color:var(--fg);border-radius:6px}
.zoombox button:hover{background:var(--panel)}
.leaflet-control-scale-line{background:rgba(255,255,255,.8);color:#222}
table.pv{width:100%;border-collapse:collapse;font-size:12px}
table.pv td,table.pv th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left}
.items li.wrap{flex-wrap:wrap}
.items .btns{display:flex;gap:6px;width:100%}
.items .btns button{padding:3px 8px;font-size:12px}
h4{margin:14px 0 6px}
.hrsbox{margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:10px}
.hr{display:grid;grid-template-columns:64px 1fr auto 1fr;gap:6px;align-items:center;margin-bottom:5px}
.hr .hd{margin:0;display:flex;gap:4px;align-items:center;color:var(--fg);font-size:13px}
.hr input[type=checkbox]{width:auto;margin:0}
.hr input[type=time]{width:100%;min-width:0;padding:5px 6px;margin:0}
.pin-body{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pin-body span{transform:rotate(45deg);font-size:15px}
.pp{min-width:190px}.pp h3{margin:0 0 4px;font-size:15px}.pp p{margin:6px 0;white-space:pre-wrap}
.pp .row{margin-top:8px}.pp button{padding:5px 8px;font-size:12px}
dialog{border:1px solid var(--line);border-radius:14px;padding:18px;width:min(92vw,380px);background:var(--bg);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 12px;font-size:16px}
#fab{position:absolute;z-index:1000;top:10px;right:10px;display:flex;flex-direction:column;gap:8px}
#fab button{background:var(--bg);box-shadow:0 1px 5px rgba(0,0,0,.35);border:0;font-size:16px;padding:8px 11px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111c;color:#fff;padding:9px 16px;border-radius:20px;z-index:3000;display:none;max-width:90vw}
.dh{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-18px;z-index:2;background:var(--bg);margin:-18px -18px 12px;padding:12px 14px 10px 18px;border-bottom:1px solid var(--line)}
.dh h2{margin:0}
.dh button{border:0;background:transparent;font-size:20px;line-height:1;padding:4px 10px;border-radius:8px}
.seg{display:flex;margin-bottom:10px}
.seg button{flex:1;border-radius:0;padding:6px 8px}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on,.srcbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
select.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.backbar{margin-bottom:10px}
.catrow2{display:grid;grid-template-columns:40px 1fr 40px 30px 30px 30px;gap:5px;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.catrow2.sub{margin-left:18px}
.catrow2 input[type=color]{padding:0;height:34px}
.catrow2 button{padding:5px 0}
.catrow2 .par,.catrow2 .emopick{grid-column:1/-1}
.catrow2 .par{font-size:12px;padding:4px 6px}
.emopick{display:flex;flex-wrap:wrap;gap:2px}
.emopick button{padding:3px 5px;font-size:18px;border:0;background:transparent}
.emopick input{width:110px;margin-left:6px}
@media (max-width:760px){
  #app{flex-direction:column}
  #sidebar{order:2;width:100%;height:46vh;border-right:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <aside id="sidebar">
    <nav id="tabs"></nav>
    <div id="panes"></div>
  </aside>
</div>
<div id="fab">
  <button id="btnSide" title="顯示/隱藏側邊欄">☰</button>
  <button id="btnLocate" title="我的位置">📍</button>
  <button id="btnExport" title="匯出備份（JSON）">⬇️</button>
</div>
<dialog id="dlg"><div class="dh"><h2 id="dlgTitle"></h2><button type="button" id="dlgX" title="關閉" aria-label="關閉">✕</button></div><div id="dlgBody"></div></dialog>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =====================================================================
 * 個人專屬地圖 — 階段一 + 階段二
 *
 * 架構與後續擴充點（階段三、四請從這裡接）：
 *  - Store.state = { version, categories[], markers[], routes[] , ...未知欄位會保留 }
 *      routes 已預留，建議結構：
 *      { id, name, profile:'foot'|'driving'|'bike', waypoints:[{lat,lng}],
 *        geometry:[[lat,lng],...], distance(m), duration(s), createdAt, track?:[{lat,lng,t}] }
 *  - Bus：簡易事件匯流排。已發出 marker:added / marker:updated / marker:removed / data:changed
 *  - UI.addTab({id,label,init(el),refresh?()})：新增側邊欄分頁（階段三的「路線」分頁用這個）
 *  - Hooks.navigateTo(marker)：階段三實作後，彈窗的「規劃從目前位置到這裡」就會呼叫它
 *  - App.getLocation()：回傳 Promise<{lat,lng}>，供導航起點使用
 *  - Store.exportJSON / importJSON：已涵蓋整個 state，未來新增的資料自動進入備份
 * ===================================================================== */
'use strict';

const KEY = 'personalMap.v1';
const VIEW_KEY = 'personalMap.view';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const isHex = s => /^#[0-9a-f]{6}$/i.test(s);
const stars = n => n > 0 ? '★'.repeat(n) + '☆'.repeat(5 - n) : '';
const fmtDate = ts => { if (!ts) return '—'; const d = new Date(ts), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const fmtDist = m => m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km';
const hav = (a, b) => { const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r,
  x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2; return 12742000 * Math.asin(Math.sqrt(x)); };

function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms);
}

const Bus = {
  h: {},
  on(e, f) { (this.h[e] = this.h[e] || []).push(f); },
  emit(e, d) { (this.h[e] || []).forEach(f => f(d)); }
};

const Hooks = { navigateTo: null };   // 階段三實作

/* ---------------- Store ---------------- */
const Store = {
  state: null,
  fresh() {
    return {
      version: 1,
      categories: [
        { id: 'food',       name: '美食',     emoji: '🍜', color: '#ef4444', parent: '' },
        { id: 'brunch',     name: '早午餐',   emoji: '🥞', color: '#f97316', parent: 'food' },
        { id: 'restaurant', name: '餐廳',     emoji: '🍽️', color: '#dc2626', parent: 'food' },
        { id: 'snack',      name: '小吃',     emoji: '🥟', color: '#fb7185', parent: 'food' },
        { id: 'secret',     name: '私房景點', emoji: '⭐', color: '#a855f7', parent: '' },
        { id: 'other',      name: '其他',     emoji: '📍', color: '#6b7280', parent: '' }
      ],
      markers: [],
      routes: [],
      places: [],      // 常用地點 {id,name,lat,lng}
      settings: { v: 3, startMode: 'gps', defaultPlaceId: '', defaultZoom: 17, searchRadiusKm: 2, autoGeocode: true, longPressMs: 700 }
    };
  },
  normalize(d) {
    const f = this.fresh();
    d = (d && typeof d === 'object') ? d : {};
    let cats = (Array.isArray(d.categories) ? d.categories : []).filter(c => c && c.id)
      .map(c => ({ id: String(c.id), name: String(c.name || '未命名'), emoji: String(c.emoji || '📍'), color: isHex(c.color) ? c.color : '#6b7280', parent: c.parent ? String(c.parent) : '' }));
    if (!cats.length) cats = f.categories.map(c => ({ ...c }));
    if (!cats.some(c => c.id === 'other')) cats.push({ ...f.categories.find(c => c.id === 'other') });
    cats.forEach(c => { const p = cats.find(x => x.id === c.parent); if (!p || p.parent || p.id === c.id) c.parent = ''; });
    const ids = new Set(cats.map(c => c.id));
    const markers = (Array.isArray(d.markers) ? d.markers : [])
      .filter(m => m && Number.isFinite(+m.lat) && Number.isFinite(+m.lng))
      .map(m => ({
        id: String(m.id || uid()), name: String(m.name || '未命名'),
        catId: ids.has(m.catId) ? m.catId : 'other',
        rating: Math.min(5, Math.max(0, parseInt(m.rating) || 0)),
        note: String(m.note || ''), lat: +m.lat, lng: +m.lng,
        addr: String(m.addr || ''), hours: String(m.hours || ''), hoursUpdatedAt: +m.hoursUpdatedAt || 0,
        hoursData: (m.hoursData && typeof m.hoursData === 'object') ? m.hoursData : null, hoursNote: String(m.hoursNote || ''),
        src: m.src || '', osmId: m.osmId || '',
        createdAt: m.createdAt || Date.now(), updatedAt: m.updatedAt || Date.now()
      }));
    const places = (Array.isArray(d.places) ? d.places : []).filter(p => p && Number.isFinite(+p.lat) && Number.isFinite(+p.lng))
      .map(p => ({ id: String(p.id || uid()), name: String(p.name || '未命名'), lat: +p.lat, lng: +p.lng }));
    const ds = (d.settings && typeof d.settings === 'object') ? d.settings : {};
    const settings = { ...f.settings, ...ds };
    if (!(ds.v >= 2)) { settings.v = 2; settings.defaultZoom = 17; }   // 預設縮放改為 17（舊資料只遷移一次，之後依你的設定）
    settings.searchRadiusKm = Math.min(5, Math.max(0.1, +settings.searchRadiusKm || 2));
    if (!(ds.v >= 3)) {   // 一次性整理：刪除沒用到的「咖啡、住宿」，補上美食底下的子分類
      settings.v = 3;
      const used = new Set(markers.map(m => m.catId));
      cats = cats.filter(c => !((c.id === 'cafe' || c.id === 'stay') && !used.has(c.id)));
      if (cats.some(c => c.id === 'food' && !c.parent)) f.categories.filter(c => c.parent === 'food').forEach(c => { if (!cats.some(x => x.id === c.id)) cats.push({ ...c }); });
    }
    return { ...d, version: 1, categories: cats, markers, routes: Array.isArray(d.routes) ? d.routes : [], places, settings };
  },
  load() {
    try { const r = localStorage.getItem(KEY); this.state = r ? this.normalize(JSON.parse(r)) : this.fresh(); }
    catch (e) { this.state = this.fresh(); }
  },
  save() {
    try { localStorage.setItem(KEY, JSON.stringify(this.state)); }
    catch (e) { toast('⚠️ 瀏覽器儲存失敗，請盡快匯出備份'); }
  },
  exportJSON() {
    const blob = new Blob([JSON.stringify({ ...this.state, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    const d = new Date(), p = n => String(n).padStart(2, '0');
    a.href = URL.createObjectURL(blob);
    a.download = `my-map-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  importJSON(text, overwrite) {
    const inc = this.normalize(JSON.parse(text));
    if (overwrite) { this.state = inc; }
    else {
      const mergeBy = (a, b) => { const m = new Map(a.map(x => [x.id, x])); b.forEach(x => m.set(x.id, x)); return [...m.values()]; };
      const cur = this.state;
      this.state = this.normalize({
        ...cur, ...inc,
        categories: mergeBy(cur.categories, inc.categories),
        markers: mergeBy(cur.markers, inc.markers),
        routes: mergeBy(cur.routes, inc.routes),
        places: mergeBy(cur.places, inc.places),
        settings: cur.settings
      });
    }
    this.save(); Bus.emit('data:changed');
    return inc.markers.length;
  }
};

Store.load();   // 必須最先載入，後面的模組初始化都會用到 Store.state

/* ---------------- Categories ---------------- */
const Cats = {
  get(id) { const l = Store.state.categories; return l.find(c => c.id === id) || l.find(c => c.id === 'other'); },
  tree() {   // 頂層分類依序排列，子分類緊跟在父分類後面
    const l = Store.state.categories, out = [];
    l.filter(c => !c.parent).forEach(c => { out.push({ c, depth: 0 }); l.filter(k => k.parent === c.id).forEach(k => out.push({ c: k, depth: 1 })); });
    return out;
  },
  options(sel) { return this.tree().map(({ c, depth }) => `<option value="${esc(c.id)}" ${c.id === sel ? 'selected' : ''}>${depth ? '　└ ' : ''}${esc(c.emoji)} ${esc(c.name)}</option>`).join(''); },
  ensure(c) {   // 沒有這個分類就建立（附近搜尋、匯入用）
    const l = Store.state.categories; let f = l.find(x => x.id === c.id);
    if (!f) { f = { id: c.id, name: c.name, emoji: c.emoji, color: c.color, parent: '' }; l.push(f); }
    return f;
  },
  icon(c) {
    return L.divIcon({
      className: 'pin',
      html: `<div class="pin-body" style="background:${c.color}"><span>${esc(c.emoji)}</span></div>`,
      iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28]
    });
  }
};

/* ---------------- Map ---------------- */
const saved = (() => { try { return JSON.parse(localStorage.getItem(VIEW_KEY)); } catch (e) { return null; } })();
const map = L.map('map', { zoomControl: false }).setView(saved ? [saved.lat, saved.lng] : [25.0330, 121.5654], saved ? saved.z : 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
map.on('moveend', () => {
  const c = map.getCenter();
  try { localStorage.setItem(VIEW_KEY, JSON.stringify({ lat: c.lat, lng: c.lng, z: map.getZoom() })); } catch (e) {}
});

const App = {
  pick: null,           // 地圖選點回呼
  me: null,
  getLocation() {
    return new Promise((res, rej) => {
      if (!navigator.geolocation) return rej(new Error('此瀏覽器不支援定位'));
      navigator.geolocation.getCurrentPosition(
        p => { this.me = { lat: p.coords.latitude, lng: p.coords.longitude }; res(this.me); },
        e => rej(new Error('無法取得位置（請允許定位權限；需 https 或 localhost）')),
        { enableHighAccuracy: true, timeout: 12000 });
    });
  }
};

/* ---------------- Markers ---------------- */
const Markers = {
  layer: L.layerGroup().addTo(map),
  byId: {},
  render() {
    this.layer.clearLayers(); this.byId = {};
    Store.state.markers.forEach(m => {
      const mk = L.marker([m.lat, m.lng], { icon: Cats.icon(Cats.get(m.catId)), title: m.name });
      mk.bindPopup(() => this.popup(m));
      mk.addTo(this.layer);
      this.byId[m.id] = mk;
    });
  },
  popup(m) {
    const c = Cats.get(m.catId), d = document.createElement('div');
    d.className = 'pp';
    d.innerHTML = `<h3>${esc(c.emoji)} ${esc(m.name)}</h3>
      <div class="muted">${esc(c.name)} ${stars(m.rating)}</div>
      ${m.addr ? `<div class="muted">📮 ${esc(m.addr)}</div>` : ''}
      ${m.hours ? `<div>🕒 ${esc(m.hours)} <span class="muted">（營業時間更新於 ${fmtDate(m.hoursUpdatedAt || m.updatedAt)}）</span></div>` : ''}
      ${m.note ? `<p>${esc(m.note)}</p>` : ''}
      <div class="muted">${m.lat.toFixed(5)}, ${m.lng.toFixed(5)}｜最後編輯：${fmtDate(m.updatedAt)}</div>
      <div class="row"><button class="primary" data-a="nav">🧭 規劃從目前位置到這裡</button>
      <button data-a="fav">⭐ 設為常用地點</button><button data-a="edit">編輯</button><button data-a="del" class="danger">刪除</button></div>`;
    d.addEventListener('click', e => {
      const a = e.target.dataset.a; if (!a) return;
      if (a === 'nav') {
        if (Hooks.navigateTo) Hooks.navigateTo(m); else toast('🧭 路線規劃將於階段三開放');
      } else if (a === 'fav') { Places.add({ name: m.name, lat: m.lat, lng: m.lng }); }
      else if (a === 'edit') { map.closePopup(); Form.openEdit(m); }
      else if (a === 'del') { if (confirm(`刪除「${m.name}」？`)) this.remove(m.id); }
    });
    return d;
  },
  add(d) {
    const m = { id: uid(), ...d, hoursUpdatedAt: d.hours ? Date.now() : 0, createdAt: Date.now(), updatedAt: Date.now() };
    Store.state.markers.push(m); Store.save();
    Bus.emit('marker:added', m); Bus.emit('data:changed'); return m;
  },
  addMany(list, { dedupe = true } = {}) {   // 批次新增（匯入、附近搜尋），結束才存檔與重繪一次
    const now = Date.now(), cur = Store.state.markers; let n = 0, dup = 0;
    const osm = new Set(cur.filter(m => m.osmId).map(m => m.osmId));
    for (const d of list) {
      if (dedupe) {
        if (d.osmId && osm.has(d.osmId)) { dup++; continue; }
        if (cur.some(m => m.name === d.name && Math.abs(m.lat - d.lat) < 0.0005 && Math.abs(m.lng - d.lng) < 0.0005)) { dup++; continue; }
      }
      cur.push({ rating: 0, note: '', addr: '', hours: '', ...d, id: uid(), hoursUpdatedAt: d.hours ? now : 0, createdAt: now, updatedAt: now });
      if (d.osmId) osm.add(d.osmId);
      n++;
    }
    Store.save(); Bus.emit('data:changed');
    return { n, dup };
  },
  update(id, d) {
    const m = Store.state.markers.find(x => x.id === id); if (!m) return;
    const hChanged = ('hours' in d) && d.hours !== (m.hours || '');
    Object.assign(m, d, { updatedAt: Date.now() });
    if (hChanged) m.hoursUpdatedAt = d.hours ? Date.now() : 0;
    Store.save();
    Bus.emit('marker:updated', m); Bus.emit('data:changed');
  },
  remove(id) {
    Store.state.markers = Store.state.markers.filter(x => x.id !== id); Store.save();
    Bus.emit('marker:removed', id); Bus.emit('data:changed');
  },
  focus(id) {
    const mk = this.byId[id]; if (!mk) return;
    let done = false;
    const open = () => { if (!done) { done = true; mk.openPopup(); } };
    map.flyTo(mk.getLatLng(), Math.max(map.getZoom(), 16), { duration: 1 });
    map.once('moveend', open); setTimeout(open, 1600);
  }
};

/* ---------------- Geo：Nominatim 反查地名 + Overpass 查附近 ----------------
 * 皆為 OpenStreetMap 免費服務、免 API Key。請勿高頻率呼叫（Nominatim 限制約每秒 1 次，
 * 本程式只在「點擊地圖」或按「查詢地名」時才呼叫一次）。 */
const Geo = {
  OP: ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://overpass.private.coffee/api/interpreter'],
  _c: new Map(),   // 查詢快取（5 分鐘），重複查同一處不再打伺服器
  async json(url, opt, ms = 15000) {
    const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
    try { const r = await fetch(url, { ...opt, signal: ac.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
    finally { clearTimeout(t); }
  },
  reverse(lat, lng) {
    return this.json(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&extratags=1&namedetails=1&accept-language=zh-TW,zh,en`);
  },
  async overpass(q, ms = 35000) {   // 同時問多個鏡像伺服器，誰先回來用誰，其餘取消
    const hit = this._c.get(q);
    if (hit && Date.now() - hit.t < 300000) return hit.v;
    const acs = this.OP.map(() => new AbortController());
    try {
      const v = await Promise.any(this.OP.map(async (u, i) => {
        const t = setTimeout(() => acs[i].abort(), ms);
        try {
          const r = await fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'data=' + encodeURIComponent(q), signal: acs[i].signal });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const j = await r.json();
          if (j.remark && !(j.elements || []).length && /error|timeout|exceeded/i.test(j.remark)) throw new Error(j.remark);
          return j.elements || [];
        } finally { clearTimeout(t); }
      }));
      acs.forEach(a => a.abort());
      this._c.set(q, { t: Date.now(), v });
      return v;
    } catch (e) { throw (e && e.errors && e.errors[0]) || e; }
  },
  addrFromTags(t) {
    if (t['addr:full']) return t['addr:full'];
    return [t['addr:city'], t['addr:district'] || t['addr:suburb'], t['addr:street'], t['addr:housenumber'] ? t['addr:housenumber'] + '號' : ''].filter(Boolean).join('');
  },
  toPlace(e) {
    const t = e.tags || {}, lat = e.lat ?? (e.center && e.center.lat), lng = e.lon ?? (e.center && e.center.lon);
    if (lat == null || lng == null) return null;
    return { name: t.name || t['name:zh'] || t.brand || t.operator || t.ref || '（未命名）', lat, lng, tags: t,
      addr: this.addrFromTags(t), hours: t.opening_hours || '', phone: t.phone || t['contact:phone'] || '', osmId: e.type + '/' + e.id };
  },
  async suggest(lat, lng) {
    const ctr = { lat, lng };
    const [nom, ov] = await Promise.allSettled([
      this.reverse(lat, lng),
      this.overpass(`[out:json][timeout:10];nwr(around:40,${lat},${lng})["name"];out center tags 30;`, 15000)
    ]);
    if (nom.status === 'rejected' && ov.status === 'rejected') throw new Error('查詢失敗');
    const names = [], seen = new Set();
    const add = (label, value) => { if (value && !seen.has(value)) { seen.add(value); names.push({ label, value }); } };
    let addr = '', hours = '';
    if (nom.status === 'fulfilled' && nom.value) {
      const r = nom.value, a = r.address || {}, nd = r.namedetails || {};
      add('🏪 地點｜' + (r.name || nd.name || nd['name:zh']), r.name || nd.name || nd['name:zh']);
      if (r.extratags && r.extratags.opening_hours) hours = r.extratags.opening_hours;
      const road = a.road ? a.road + (a.house_number ? a.house_number + '號' : '') : '';
      addr = [a.city || a.county || a.state, a.city_district || a.suburb || a.town, road].filter(Boolean).join('') || '';
      if (!addr && r.display_name) addr = r.display_name;
      if (ov.status === 'fulfilled') {
        ov.value.map(e => this.toPlace(e)).filter(Boolean).map(p => ({ ...p, dist: hav(ctr, p) })).sort((x, y) => x.dist - y.dist).slice(0, 6).forEach((p, i) => {
          const ty = p.tags.amenity || p.tags.shop || p.tags.tourism || p.tags.leisure || '';
          add(`🏬 附近｜${p.name}${ty ? '（' + ty + '）' : ''} ${fmtDist(p.dist)}`, p.name);
          if (i === 0 && p.dist < 30) { if (!hours && p.hours) hours = p.hours; if (!a.house_number && p.addr && addr.length < p.addr.length) addr = p.addr; }
        });
      }
      add('🛣️ 路名｜' + road, road);
      add('🏘️ 里／社區｜' + (a.neighbourhood || a.village || ''), a.neighbourhood || a.village);
      add('🏙️ 行政區｜' + (a.city_district || a.suburb || a.town || a.county || ''), a.city_district || a.suburb || a.town || a.county);
      add('🌆 城市｜' + (a.city || a.state || ''), a.city || a.state);
    } else if (ov.status === 'fulfilled') {
      ov.value.map(e => this.toPlace(e)).filter(Boolean).map(p => ({ ...p, dist: hav(ctr, p) })).sort((x, y) => x.dist - y.dist).slice(0, 6)
        .forEach(p => { add(`🏬 附近｜${p.name} ${fmtDist(p.dist)}`, p.name); if (!hours && p.hours && p.dist < 30) hours = p.hours; });
    }
    return { names, addr, hours };
  }
};

/* ---------------- 營業時間編輯器（週一～週日勾選 + 起迄時間） ---------------- */
const DAYS = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];
function hoursText(days) {   // 連續且時段相同的日子合併成一句
  const lab = d => d.on ? ((d.s || d.e) ? `${d.s || ''}-${d.e || ''}` : '營業') : '公休';
  const out = []; let i = 0;
  while (i < 7) {
    let j = i; const t = lab(days[i]);
    while (j + 1 < 7 && lab(days[j + 1]) === t) j++;
    out.push((j > i ? `${DAYS[i]}至${DAYS[j]}` : DAYS[i]) + (t === '公休' ? '公休' : ' ' + t));
    i = j + 1;
  }
  return out.join('；');
}
function hoursEditorHTML(m) {
  const days = (m.hoursData && m.hoursData.days) || [];
  const note = m.hoursData ? (m.hoursNote || '') : (m.hours || '');
  const rows = DAYS.map((n, i) => { const r = days[i] || {};
    return `<div class="hr"><label class="hd"><input type="checkbox" name="hon${i}" ${r.on ? 'checked' : ''}> ${n}</label><input type="time" name="hs${i}" value="${esc(r.s || '')}"><span>–</span><input type="time" name="he${i}" value="${esc(r.e || '')}"></div>`; }).join('');
  return `<div class="hrsbox"><div class="muted" style="margin-bottom:6px">🕒 營業時間（店家／公開場所，選填）。先填「週一」的起迄時間，其他有勾選的營業日會自動帶入相同時間，不同的再手動改；沒勾選＝公休。</div>
    <div class="row" style="margin-bottom:6px"><button type="button" data-a="h-all">每天</button><button type="button" data-a="h-wk">週一至週五</button><button type="button" data-a="h-none">全不選</button></div>
    ${rows}<label style="margin:6px 0 0">補充／原始文字（如 24 小時、國定假日公休、OSM 資料；選填）<input name="hnote" maxlength="120" value="${esc(note)}"></label></div>`;
}

/* ---------------- Form（地圖點擊 / 編輯 / 座標新增 共用） ---------------- */
function parseCoordPair(s) {
  const m = String(s).match(/(-?\d+(?:\.\d+)?)\s*[,，\s]\s*(-?\d+(?:\.\d+)?)/);
  return m ? [+m[1], +m[2]] : null;
}
function buildForm(o) {
  const m = o.marker || {};
  const f = document.createElement('form');
  f.innerHTML = `
    <label>🔎 建議名稱（OpenStreetMap 查詢，選了會帶入下方名稱，也可手動改）<select name="sg"><option value="">— 尚未查詢，可按「查詢地名」—</option></select></label>
    <label>名稱<input name="name" required maxlength="80" value="${esc(m.name || '')}" placeholder="例如：巷口那家滷肉飯"></label>
    <div class="two">
      <label>分類<select name="cat">${Cats.options(m.catId || o.catId)}</select></label>
      <label>評分<select name="rating">${[0,1,2,3,4,5].map(n => `<option value="${n}" ${n === (m.rating || 0) ? 'selected' : ''}>${n ? '★'.repeat(n) : '未評分'}</option>`).join('')}</select></label>
    </div>
    <label>地址（選填）<input name="addr" maxlength="120" value="${esc(m.addr || '')}"></label>
    ${hoursEditorHTML(m)}
    ${m.id ? `<div class="muted" style="margin:-4px 0 8px">最後編輯：${fmtDate(m.updatedAt)}${m.hours && m.hoursUpdatedAt ? `｜營業時間更新：${fmtDate(m.hoursUpdatedAt)}` : ''}</div>` : ''}
    <label>筆記<textarea name="note" rows="3" placeholder="個人心得、停車資訊…">${esc(m.note || '')}</textarea></label>
    <div class="two">
      <label>緯度<input name="lat" required inputmode="decimal" value="${o.lat ?? m.lat ?? ''}" placeholder="25.033964"></label>
      <label>經度<input name="lng" required inputmode="decimal" value="${o.lng ?? m.lng ?? ''}" placeholder="121.564468"></label>
    </div>
    <div class="row">
      ${o.onCancel ? '<button type="button" data-a="cancel">取消</button>' : ''}
      ${o.pick ? '<button type="button" data-a="pick">📌 從地圖選點</button>' : ''}
      <button type="button" data-a="geo">🔎 查詢地名</button>
      <button class="primary">${o.submitText || '儲存'}</button>
    </div>`;
  // 貼上「25.03, 121.56」到緯度欄時自動拆開
  f.lat.addEventListener('input', () => {
    const p = parseCoordPair(f.lat.value);
    if (p && /[,，\s]/.test(f.lat.value.trim())) { f.lat.value = p[0]; f.lng.value = p[1]; }
  });
  f.addEventListener('click', e => {
    const a = e.target.dataset.a;
    if (a === 'cancel') o.onCancel();
    if (a === 'geo') runSuggest(f);
    if (a === 'h-all' || a === 'h-wk' || a === 'h-none') {
      for (let i = 0; i < 7; i++) { const on = a === 'h-all' || (a === 'h-wk' && i < 5); hrow(i).on.checked = on; if (on && i > 0) fillFromMaster(i); }
    }
    if (a === 'pick') {
      App.pick = ll => { f.lat.value = ll.lat.toFixed(6); f.lng.value = ll.lng.toFixed(6); toast('已填入座標'); };
      toast('請在地圖上點選位置');
    }
  });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const lat = parseFloat(f.lat.value), lng = parseFloat(f.lng.value);
    if (!(lat >= -90 && lat <= 90) || !(lng >= -180 && lng <= 180)) return toast('座標格式不正確（緯度 -90~90、經度 -180~180）');
    const hd = DAYS.map((_, i) => ({ on: f.elements['hon' + i].checked, s: f.elements['hs' + i].value, e: f.elements['he' + i].value }));
    const anyOn = hd.some(d => d.on), hnote = f.elements.hnote.value.trim();
    const hours = [anyOn ? hoursText(hd) : '', hnote].filter(Boolean).join('；');
    o.onSubmit({ name: f.elements.name.value.trim() || '未命名', catId: f.cat.value, rating: +f.rating.value, note: f.note.value.trim(), addr: f.addr.value.trim(),
      hours, hoursData: anyOn ? { days: hd } : null, hoursNote: hnote, lat, lng });
  });
  // 營業時間：週一是「主時段」，其他勾選的日子自動貼上；手動改過的日子（dirty）不會再被覆蓋
  const hrow = i => ({ on: f.elements['hon' + i], s: f.elements['hs' + i], e: f.elements['he' + i] });
  const fillFromMaster = i => {
    const r = hrow(i), m0 = hrow(0);
    if (!r.s.value && !r.s.dataset.dirty) r.s.value = m0.s.value;
    if (!r.e.value && !r.e.dataset.dirty) r.e.value = m0.e.value;
  };
  for (let i = 1; i < 7; i++) {   // 編輯舊資料：與週一不同的時段視為「手動調整過」
    const r = hrow(i), m0 = hrow(0);
    if (r.s.value && r.s.value !== m0.s.value) r.s.dataset.dirty = '1';
    if (r.e.value && r.e.value !== m0.e.value) r.e.dataset.dirty = '1';
  }
  f.addEventListener('input', e => {
    const mt = (e.target.name || '').match(/^h([se])(\d)$/); if (!mt) return;
    if (mt[2] === '0') {
      for (let i = 1; i < 7; i++) { const r = hrow(i); if (!r.s.dataset.dirty) r.s.value = hrow(0).s.value; if (!r.e.dataset.dirty) r.e.value = hrow(0).e.value; }
    } else e.target.dataset.dirty = '1';
  });
  f.addEventListener('change', e => {
    const mt = (e.target.name || '').match(/^hon(\d)$/);
    if (mt && e.target.checked && mt[1] !== '0') fillFromMaster(+mt[1]);
  });
  // 下拉選單選了建議名稱 → 帶入名稱欄
  f.addEventListener('change', e => {
    if (e.target.name !== 'sg') return;
    const s = e.target, i = s.value;
    if (i !== '' && s._names && s._names[i]) f.elements.name.value = s._names[i].value;
  });
  async function runSuggest(form) {
    const sel = form.querySelector('[name=sg]');
    const lat = parseFloat(form.lat.value), lng = parseFloat(form.lng.value);
    if (!isFinite(lat) || !isFinite(lng)) return toast('請先填入座標');
    const tok = form._tok = (form._tok || 0) + 1;
    sel.innerHTML = '<option value="">⏳ 查詢附近地名中…</option>';
    try {
      const r = await Geo.suggest(lat, lng);
      if (form._tok !== tok || !form.isConnected) return;
      sel._names = r.names;
      sel.innerHTML = `<option value="">— 選擇建議名稱（共 ${r.names.length} 項）—</option>` + r.names.map((n, i) => `<option value="${i}">${esc(n.label)}</option>`).join('');
      const nm = form.elements.name;
      if (!nm.value && r.names[0]) { nm.value = r.names[0].value; sel.value = '0'; }
      if (r.addr && !form.addr.value) form.addr.value = r.addr;
      const anyOn = DAYS.some((_, i) => form.elements['hon' + i].checked);
      if (r.hours && !anyOn && !form.elements.hnote.value) form.elements.hnote.value = r.hours;
      if (!r.names.length) sel.innerHTML = '<option value="">（此處查無地名，可手動輸入）</option>';
    } catch (e) {
      if (form.isConnected) sel.innerHTML = '<option value="">（查詢失敗或逾時，可手動輸入或再按「查詢地名」）</option>';
    }
  }
  if (o.suggest) runSuggest(f);
  return f;
}

    if (t.parent) {
      const bar = document.createElement('div'); bar.className = 'backbar'; bar.innerHTML = '<button type="button">← 更多</button>';

    t.init.call(tab, body);
    if (this.tabs.length === 1) this.show(t.id);
  },
  show(id) {
    const cur = this.tabs.find(t => t.id === id); if (!cur) return;

    if (cur.onShow) cur.onShow();

};

    el.innerHTML = `<div class="seg"><button type="button" data-v="list" class="on">📋 標記清單</button><button type="button" data-v="edit">✏️ 編輯分類</button></div>
      <div id="cvList"><div class="filters"><input id="q" type="search" placeholder="搜尋名稱、地址或筆記…"><select id="fcat"></select></div>
        <ul class="items" id="items"></ul><div class="muted" id="count"></div></div>
      <div id="cvEdit" style="display:none"></div>`;
    const q = $('#q', el), fc = $('#fcat', el), ul = $('#items', el), vL = $('#cvList', el), vE = $('#cvEdit', el);
    const kids = id => Store.state.categories.filter(c => c.parent === id).map(c => c.id);
    const rebuildFilter = () => { const cur = fc.value; fc.innerHTML = '<option value="">全部分類</option>' + Cats.options(cur); fc.value = cur; };
    const drawList = () => {
      const kw = q.value.trim().toLowerCase(), cat = fc.value, set = cat ? new Set([cat, ...kids(cat)]) : null;
      const list = Store.state.markers.filter(m => (!set || set.has(m.catId)) && (!kw || (m.name + ' ' + m.note + ' ' + m.addr).toLowerCase().includes(kw)))
        .sort((a, b) => b.updatedAt - a.updatedAt);
      ul.innerHTML = list.slice(0, 300).map(m => { const c = Cats.get(m.catId);
        return `<li data-id="${esc(m.id)}"><span class="ic">${esc(c.emoji)}</span><div><div class="t">${esc(m.name)}</div>
        <div class="muted">${esc(c.name)} ${stars(m.rating)} · ${fmtDate(m.updatedAt)}</div>${m.hours ? `<div class="muted">🕒 ${esc(m.hours)}</div>` : ''}${m.note ? `<div class="muted">${esc(m.note.slice(0, 40))}</div>` : ''}</div></li>`; }).join('')
        || '<li class="muted" style="cursor:default">沒有符合的標記。長按地圖空白處即可新增。</li>';
      $('#count', el).textContent = `共 ${Store.state.markers.length} 個標記` + (list.length !== Store.state.markers.length ? `，符合 ${list.length}` : '') + (list.length > 300 ? '（僅列出前 300 筆）' : '');
    };
    const save = () => { Store.save(); Bus.emit('data:changed'); };
    const drawEdit = () => {
      vE.innerHTML = '<p class="muted">點圖示可更換；▲▼ 調整順序；「上層分類」可把分類放到某分類底下（例如早午餐放在美食下）。</p><div id="catlist"></div><button type="button" id="addCat">＋ 新增分類</button>';
      const box = $('#catlist', vE), tops = Store.state.categories.filter(c => !c.parent);
      Cats.tree().forEach(({ c, depth }) => {
        const r = document.createElement('div'); r.className = 'catrow2' + (depth ? ' sub' : '');
        const hasKids = kids(c.id).length > 0;
        r.innerHTML = `<button type="button" class="emo" title="更換圖示">${esc(c.emoji)}</button><input data-k="name" value="${esc(c.name)}" maxlength="20">
          <input data-k="color" type="color" value="${esc(c.color)}"><button type="button" data-a="up" title="上移">▲</button><button type="button" data-a="down" title="下移">▼</button>
          <button type="button" class="danger" data-a="del" ${c.id === 'other' ? 'disabled' : ''} title="刪除">✕</button>
          ${hasKids ? '' : `<select data-k="parent" class="par"><option value="">（頂層分類）</option>${tops.filter(p => p.id !== c.id).map(p => `<option value="${esc(p.id)}" ${p.id === c.parent ? 'selected' : ''}>上層：${esc(p.emoji)} ${esc(p.name)}</option>`).join('')}</select>`}
          <div class="emopick" style="display:none"></div>`;
        const setEmoji = v => { v = String(v || '').trim(); if (!v) return; c.emoji = v; save(); drawEdit(); };
        r.addEventListener('change', e => {
          const k = e.target.dataset.k; if (!k) return;
          if (k === 'emopick') return;
          c[k] = e.target.value || (k === 'parent' ? '' : c[k]); save(); if (k === 'parent') drawEdit();
        });
        r.addEventListener('click', e => {
          const b = e.target.closest('button'); if (!b) return;
          if (b.classList.contains('emo')) {
            const pk = r.querySelector('.emopick');
            if (pk.style.display === 'none') {
              pk.innerHTML = EMOJIS.map(x => `<button type="button" data-e="${x}">${x}</button>`).join('') + '<input class="emin" placeholder="自訂 emoji" maxlength="4">';
              pk.style.display = 'flex';
              pk.querySelector('.emin').addEventListener('change', ev => setEmoji(ev.target.value));
            } else pk.style.display = 'none';
            return;
          }
          if (b.dataset.e) return setEmoji(b.dataset.e);
          const a = b.dataset.a;
          if (a === 'up' || a === 'down') {
            const L2 = Store.state.categories, sib = L2.filter(x => (x.parent || '') === (c.parent || ''));
            const i = sib.indexOf(c), n = sib[i + (a === 'up' ? -1 : 1)]; if (!n) return;
            const ia = L2.indexOf(c), ib = L2.indexOf(n); [L2[ia], L2[ib]] = [L2[ib], L2[ia]]; save(); drawEdit();
          } else if (a === 'del') {
            const to = c.parent || 'other';
            if (!confirm(`刪除分類「${c.name}」？此分類的標記會移到「${Cats.get(to).name}」。`)) return;
            Store.state.markers.forEach(m => { if (m.catId === c.id) m.catId = to; });
            Store.state.categories.forEach(x => { if (x.parent === c.id) x.parent = ''; });
            Store.state.categories = Store.state.categories.filter(x => x.id !== c.id); save(); drawEdit();
          }
        });
        box.appendChild(r);
      });
      $('#addCat', vE).onclick = () => { Store.state.categories.push({ id: uid(), name: '新分類', emoji: '🔖', color: '#0ea5e9', parent: '' }); save(); drawEdit(); };
    };
    $('.seg', el).onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      [...$('.seg', el).children].forEach(x => x.classList.toggle('on', x === b));
      vL.style.display = b.dataset.v === 'list' ? '' : 'none'; vE.style.display = b.dataset.v === 'edit' ? '' : 'none';
    };
    q.oninput = drawList; fc.onchange = drawList;
    ul.onclick = e => { const li = e.target.closest('li[data-id]'); if (li) Markers.focus(li.dataset.id); };
    this.refresh = () => { rebuildFilter(); drawList(); if (vE.style.display === 'none' || !vE.contains(document.activeElement)) drawEdit(); };
    this.refresh();
  }
});

/* --- 分頁：查詢（原「座標」）：輸入地址或名稱，找地點並新增標記；保留座標新增表單 --- */
UI.addTab({
  id: 'coord', label: '🔎 查詢', parent: 'more', hidden: true,
  init(el) {
    el.innerHTML = `<p class="muted">輸入地址、地名或店名（例：台北101、忠孝東路四段），也可直接輸入座標「25.03, 121.56」。結果來自 OpenStreetMap（Nominatim）。</p>
      <div class="row" style="flex-wrap:nowrap;margin-bottom:8px"><input id="qIn" type="search" placeholder="輸入地址或名稱…" style="flex:1"><button class="primary" id="qGo" type="button">查詢</button></div>
      <div class="muted" id="qSt"></div><ul class="items" id="qList"></ul>
      <details style="margin-top:12px"><summary>📌 以座標新增標記</summary><div id="qForm" style="margin-top:8px"></div></details>`;
    const qIn = $('#qIn', el), st = $('#qSt', el), ul = $('#qList', el), qLayer = L.layerGroup().addTo(map);
    let results = [];
    const draw = () => {
      ul.innerHTML = results.map((r, i) => `<li class="wrap" data-i="${i}"><span class="ic">📍</span><div style="flex:1"><div class="t">${esc(r.name)}</div><div class="muted">${esc(r.addr)}</div></div>
        <div class="btns"><button type="button" data-a="go">前往</button><button type="button" data-a="add">＋ 新增標記</button><button type="button" data-a="fav">⭐ 常用</button></div></li>`).join('');
    };
    const go = i => {
      const r = results[i]; if (!r) return;
      qLayer.clearLayers();
      L.circleMarker([r.lat, r.lng], { radius: 10, color: '#fff', weight: 3, fillColor: '#ef4444', fillOpacity: 1, interactive: false }).addTo(qLayer);
      map.flyTo([r.lat, r.lng], Math.max(defZoom(), 17));
    };
    const run = async () => {
      const v = qIn.value.trim(); if (!v) return;
      const cp = parseCoordPair(v);
      if (cp && /^[-+\d.\s,，]+$/.test(v) && Math.abs(cp[0]) <= 90 && Math.abs(cp[1]) <= 180) {
        results = [{ name: '座標', addr: `${cp[0]}, ${cp[1]}`, lat: cp[0], lng: cp[1], raw: true }]; st.textContent = ''; draw(); go(0); return;
      }
      st.textContent = '⏳ 查詢中…'; ul.innerHTML = '';
      try {
        const b = map.getBounds();
        const j = await Geo.json(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&addressdetails=1&accept-language=zh-TW,zh,en&q=${encodeURIComponent(v)}&viewbox=${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}`);
        results = j.map(r => ({ name: String(r.name || r.display_name.split(',')[0]).trim(), addr: r.display_name, lat: +r.lat, lng: +r.lon }));
        st.textContent = results.length ? `找到 ${results.length} 筆（可再輸入更完整的地址縮小範圍）` : '找不到，試試更完整的地址或換個關鍵字';
        draw(); if (results.length) go(0);
      } catch (e) { st.textContent = '❌ 查詢失敗或逾時，請稍後再試。'; }
    };
    $('#qGo', el).onclick = run;
    qIn.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
    ul.onclick = e => {
      const li = e.target.closest('li[data-i]'); if (!li) return;
      const i = +li.dataset.i, r = results[i], a = e.target.dataset.a;
      if (a === 'add') Form.openNew({ lat: r.lat, lng: r.lng }, { name: r.raw ? '' : r.name, addr: r.raw ? '' : r.addr });
      else if (a === 'fav') Places.add({ name: r.raw ? r.addr : r.name, lat: r.lat, lng: r.lng });
      else go(i);
    };
    const mount = () => {
      const box = $('#qForm', el); box.innerHTML = '';
      box.appendChild(buildForm({ catId: 'food', pick: true, submitText: '新增標記', onSubmit: d => { const m = Markers.add(d); toast('已新增'); Markers.focus(m.id); mount(); } }));
    };
    mount();
    this.refresh = () => { const s = $('select[name=cat]', el); if (s) { const v = s.value; s.innerHTML = Cats.options(v); s.value = v; } };
  }
});

/* --- 分頁：附近搜尋 --- */
UI.addTab({
  id: 'near', label: '🔎 附近',
  init(el) {
    el.innerHTML = `<p class="muted">以某點為中心，向 OpenStreetMap 查詢半徑內的店家／設施，直接標在地圖上。預設以目前 GPS 為中心（藍色按鈕＝目前使用的中心來源）。</p>
      <div class="row" style="margin-bottom:8px"><button type="button" class="srcbtn" id="nGps">🛰️ 目前 GPS</button><button type="button" class="srcbtn" id="nPick">📍 地圖點選</button></div>
      <label>或使用常用地點<select id="nPlace"></select></label>
      <div class="muted" id="nCenter">尚未設定中心點</div>
      <div class="two" style="margin-top:8px">
        <label>半徑：<b id="nRv"></b> 公里<input type="range" id="nR" min="0.1" max="5" step="0.1"></label>
        <label>分類<select id="nCat"></select></label>
      </div>
      <div class="row"><button class="primary" id="nGo" type="button">🔎 尋找附近</button><button id="nClr" type="button">清除結果</button><button id="nAll" type="button" style="display:none"></button></div>
      <div class="muted" id="nSt" style="margin-top:6px"></div><ul class="items" id="nList"></ul>`;
    const q = s => $(s, el);
    const R = q('#nR'), catSel = q('#nCat'), st = q('#nSt'), ul = q('#nList'), plSel = q('#nPlace');
    const layer = L.layerGroup().addTo(map), cLayer = L.layerGroup().addTo(map);
    let center = null, results = [], tried = false;
    catSel.innerHTML = '<option value="all">全部（不含交通）</option>' + PRESETS.map(p => `<option value="${p.id}">${p.emoji} ${p.label}</option>`).join('');
    R.value = Store.state.settings.searchRadiusKm; q('#nRv').textContent = R.value;

    const drawCenter = () => {
      cLayer.clearLayers(); if (!center) return;
      L.circle([center.lat, center.lng], { radius: R.value * 1000, color: '#2563eb', weight: 1.5, fillOpacity: .05, interactive: false }).addTo(cLayer);
      L.circleMarker([center.lat, center.lng], { radius: 6, color: '#fff', weight: 2, fillColor: '#2563eb', fillOpacity: 1, interactive: false }).addTo(cLayer);
    };
    const mark = src => { q('#nGps').classList.toggle('on', src === 'gps'); q('#nPick').classList.toggle('on', src === 'pick'); plSel.classList.toggle('on', src === 'place'); };
    const setCenter = (ll, label, src) => {
      center = { lat: ll.lat, lng: ll.lng }; mark(src);
      q('#nCenter').textContent = `✅ 中心：${label}（${center.lat.toFixed(5)}, ${center.lng.toFixed(5)}）`;
      if (src !== 'place') plSel.value = '';
      drawCenter();
    };
    const useGps = async fly => {
      try { const p = await App.getLocation(); setCenter(p, '目前 GPS', 'gps'); if (fly) map.flyTo([p.lat, p.lng], defZoom()); }
      catch (e) { toast(e.message); }
    };
    R.oninput = () => { q('#nRv').textContent = R.value; drawCenter(); };
    q('#nGps').onclick = () => useGps(true);
    q('#nPick').onclick = () => { App.pick = ll => setCenter(ll, '地圖點選', 'pick'); toast('請在地圖上單擊選擇中心點'); };
    plSel.onchange = () => { const p = Store.state.places.find(x => x.id === plSel.value); if (p) { setCenter(p, p.name, 'place'); map.flyTo([p.lat, p.lng], defZoom()); } };
    this.onShow = () => { if (!center && !tried) { tried = true; useGps(false); } };   // 第一次進入「附近」自動使用目前 GPS

    const toMarker = r => ({ name: r.name, catId: r.p.cat, rating: 0, note: r.phone ? '電話：' + r.phone : '', lat: r.lat, lng: r.lng, addr: r.addr, hours: r.hours, src: 'osm', osmId: r.osmId });
    const addMany = rs => { rs.forEach(r => ensurePresetCat(r.p)); const x = Markers.addMany(rs.map(toMarker)); toast(`已加入 ${x.n} 筆` + (x.dup ? `，略過重複 ${x.dup} 筆` : '')); };
    const popupFor = r => {
      const d = document.createElement('div'); d.className = 'pp';
      d.innerHTML = `<h3>${esc(r.p.emoji)} ${esc(r.name)}</h3><div class="muted">${esc(r.p.label)}｜距中心 ${fmtDist(r.dist)}</div>
        ${r.addr ? `<div class="muted">📮 ${esc(r.addr)}</div>` : ''}
        ${r.hours ? `<div>🕒 ${esc(r.hours)}</div>` : '<div class="muted">🕒 OSM 無營業時間資料</div>'}
        ${r.phone ? `<div class="muted">☎ ${esc(r.phone)}</div>` : ''}
        <div class="row"><button class="primary" data-a="add">＋ 加入我的標記</button></div>`;
      d.onclick = e => { if (e.target.dataset.a === 'add') { addMany([r]); } };
      return d;
    };
    const clear = () => { layer.clearLayers(); results = []; ul.innerHTML = ''; st.textContent = ''; q('#nAll').style.display = 'none'; };
    q('#nClr').onclick = () => { clear(); cLayer.clearLayers(); center = null; mark(''); q('#nCenter').textContent = '尚未設定中心點'; };
    q('#nAll').onclick = () => addMany(results);

    q('#nGo').onclick = async () => {
      if (!center) return toast('請先設定中心點（目前 GPS、地圖點選或常用地點）');
      Store.state.settings.searchRadiusKm = +R.value; Store.save();
      const sel = catSel.value === 'all' ? PRESETS.filter(p => !p.transit) : PRESETS.filter(p => p.id === catSel.value);
      const rad = Math.round(R.value * 1000), parts = [];
      sel.forEach(p => p.q.forEach(c => parts.push(`nwr(around:${rad},${center.lat},${center.lng})${c};`)));
      clear(); drawCenter();
      st.textContent = '⏳ 查詢中…（範圍大或分類多時可能需要十幾秒）';
      q('#nGo').disabled = true;
      try {
        const els = await Geo.overpass(`[out:json][timeout:30];(${parts.join('')});out center tags 400;`);
        const seen = new Set();
        results = els.filter(e => !seen.has(e.type + e.id) && seen.add(e.type + e.id)).map(e => Geo.toPlace(e)).filter(Boolean)
          .map(p => ({ ...p, p: (sel.find(x => x.match(p.tags)) || PRESETS.find(x => x.match(p.tags)) || sel[0]), dist: hav(center, p) }))
          .sort((a, b) => a.dist - b.dist);
        results.forEach(r => {
          L.marker([r.lat, r.lng], { icon: Cats.icon(r.p), title: r.name }).bindPopup(() => popupFor(r)).addTo(layer);
        });
        st.textContent = results.length ? `找到 ${results.length} 個地點${results.length >= 400 ? '（已達上限 400，請縮小半徑）' : ''}（資料來自 OpenStreetMap，可能不完整）` : '範圍內沒有找到，試試放大半徑或換分類';
        ul.innerHTML = results.slice(0, 100).map((r, i) => `<li data-i="${i}"><span class="ic">${esc(r.p.emoji)}</span><div><div class="t">${esc(r.name)}</div>
          <div class="muted">${esc(r.p.label)}｜${fmtDist(r.dist)}${r.hours ? '｜🕒 ' + esc(r.hours) : ''}</div></div></li>`).join('');
        if (results.length) { const b = q('#nAll'); b.style.display = ''; b.textContent = `＋ 全部加入我的標記（${results.length}）`; }
        if (results.length) map.fitBounds(L.latLngBounds([[center.lat, center.lng], ...results.map(r => [r.lat, r.lng])]).pad(.1));
      } catch (e) { st.textContent = '❌ 查詢失敗或逾時（Overpass 伺服器忙碌），請稍後再試或縮小半徑／分類。'; }
      q('#nGo').disabled = false;
    };

/* --- 匯入器：CSV / JSON / GeoJSON --- */
const Importer = {
  A: {
    lat: ['lat', 'latitude', '緯度', 'y', 'wgs84ay'],
    lng: ['lng', 'lon', 'long', 'longitude', '經度', 'x', 'wgs84ax'],
    name: ['name', '名稱', '店名', '站名', '分店名稱', '門市名稱', '分店名', '加油站名稱', '據點名稱', '店家', 'title', 'label'],
    addr: ['address', 'addr', '地址', '門市地址', '店址', '詳細地址', '地點'],
    hours: ['hours', 'opening_hours', '營業時間', '服務時間'],
    note: ['note', 'notes', '備註', '說明', 'description', 'memo'],
    cat: ['category', '分類', '類別', 'type', '類型'],
    rating: ['rating', '評分']
  },
  decode(buf) {
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch (e) { try { return new TextDecoder('big5').decode(buf); } catch (e2) { return new TextDecoder().decode(buf); } }
  },
  parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/, 1)[0];
    const delim = [',', '\t', ';', '|'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
    const rows = []; let row = [], cur = '', inq = false;
    const endRow = () => { row.push(cur); cur = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; };
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inq) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inq = false; } else cur += c; }
      else if (c === '"') inq = true;
      else if (c === delim) { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; endRow(); }
      else cur += c;
    }
    if (cur !== '' || row.length) endRow();
    if (!rows.length) return [];
    const head = rows.shift().map(h => h.trim());
    return rows.map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
  },
  records(text) {
    const t = text.replace(/^﻿/, '').trim();
    if (t[0] === '{' || t[0] === '[') {
      const j = JSON.parse(t);
      if (j && j.type === 'FeatureCollection' && Array.isArray(j.features)) {
        return j.features.map(f => {
          let c = (f.geometry || {}).coordinates;
          while (Array.isArray(c) && Array.isArray(c[0])) c = c[0];
          return { ...(f.properties || {}), lat: c ? c[1] : undefined, lng: c ? c[0] : undefined };
        });
      }
      if (Array.isArray(j)) return j;
      const arr = Object.values(j || {}).find(v => Array.isArray(v) && v.length && typeof v[0] === 'object');
      if (arr) return arr;
      throw new Error('JSON 中找不到清單陣列');
    }
    return this.parseCSV(t);
  },
  pick(r, keys) {
    const low = {}; for (const k in r) low[k.trim().toLowerCase()] = r[k];
    for (const k of keys) { const v = low[k]; if (v !== undefined && v !== null && String(v).trim() !== '') return String(v).trim(); }
    return '';
  },
  norm(r) {
    let lat = parseFloat(this.pick(r, this.A.lat)), lng = parseFloat(this.pick(r, this.A.lng));
    if (!isFinite(lat) || !isFinite(lng)) return null;
    if (Math.abs(lat) > 90 && Math.abs(lng) <= 90) [lat, lng] = [lng, lat];   // 欄位填反時自動對調
    if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    const addr = this.pick(r, this.A.addr);
    return { name: (this.pick(r, this.A.name) || addr || '未命名').slice(0, 80), lat, lng, addr,
      hours: this.pick(r, this.A.hours), note: this.pick(r, this.A.note), catName: this.pick(r, this.A.cat),
      rating: Math.min(5, Math.max(0, parseInt(this.pick(r, this.A.rating)) || 0)) };
  }
};

/* --- 分頁：匯入外部清單 --- */
UI.addTab({
  id: 'import', label: '📁 匯入', parent: 'more', hidden: true,
  init(el) {
    el.innerHTML = `<p class="muted">匯入 CSV、JSON（物件陣列）或 GeoJSON，例如加油站、全聯門市清單。欄位可用：名稱（name／店名／站名）、緯度（lat）、經度（lng／lon）、地址、營業時間、備註、分類。支援 UTF-8 與 Big5 編碼。</p>
      <label>選擇檔案（CSV／JSON／GeoJSON／本程式備份檔）<input type="file" id="iFile"></label>
      <label>或從網址載入（對方網站需允許跨來源存取）</label>
      <div class="row" style="margin:-4px 0 8px"><input id="iUrl" placeholder="https://…/stations.csv" style="flex:1"><button id="iLoad">載入</button></div>
      <div id="iPv"></div>
      <p><a href="#" id="iSample">⬇️ 下載範例 CSV（看欄位格式）</a></p>`;
    const pv = $('#iPv', el);
    let rows = [], skipped = 0;

    const load = (text, name) => {
      try {
        const tr = text.trim();
        if (tr[0] === '{' && /"markers"\s*:/.test(tr)) {   // 本程式的備份檔：直接在這裡還原
          let j = null; try { j = JSON.parse(tr); } catch (e) {}
          if (j && Array.isArray(j.markers) && Array.isArray(j.categories)) {
            pv.innerHTML = `<div style="margin:10px 0"><b>${esc(name)}</b>：本程式的備份檔（${j.markers.length} 個標記、${j.categories.length} 個分類）</div>
              <div class="row"><button class="primary" id="bMerge">合併匯入</button><button class="danger" id="bOver">覆蓋還原</button><button id="bCancel">取消</button></div>`;
            $('#bMerge', pv).onclick = () => { try { const n = Store.importJSON(tr, false); toast(`已合併（檔內 ${n} 個標記）`); pv.innerHTML = ''; } catch (e) { toast('匯入失敗'); } };
            $('#bOver', pv).onclick = () => { if (confirm('覆蓋會取代目前所有資料，確定？')) { try { const n = Store.importJSON(tr, true); toast(`已還原（${n} 個標記）`); pv.innerHTML = ''; } catch (e) { toast('匯入失敗'); } } };
            $('#bCancel', pv).onclick = () => { pv.innerHTML = ''; };
            return;
          }
        }
        const recs = Importer.records(text);
        rows = []; skipped = 0;
        recs.forEach(r => { const n = Importer.norm(r); n ? rows.push(n) : skipped++; });
        if (!rows.length) {
          const keys = recs[0] ? Object.keys(recs[0]).slice(0, 12).join('、') : '（無）';
          pv.innerHTML = `<p class="muted">❌ 找不到可用的資料列：需要有緯度、經度欄位。共讀到 ${recs.length} 列，偵測到的欄位：${esc(keys)}。</p>`; return;
        }
        preview(name);
      } catch (e) { pv.innerHTML = `<p class="muted">❌ 解析失敗：${esc(e.message)}</p>`; }
    };

    const preview = name => {
      const base = String(name).replace(/\.[^.]*$/, '').slice(0, 20);
      pv.innerHTML = `<div style="margin:10px 0"><b>${esc(name)}</b>：可匯入 <b>${rows.length}</b> 筆${skipped ? `，缺座標略過 ${skipped} 筆` : ''}</div>
        <table class="pv"><tr><th>名稱</th><th>緯度</th><th>經度</th><th>地址</th></tr>${rows.slice(0, 5).map(r => `<tr><td>${esc(r.name)}</td><td>${r.lat}</td><td>${r.lng}</td><td>${esc(r.addr)}</td></tr>`).join('')}</table>
        <label style="margin-top:10px">匯入到分類<select id="iCat"><option value="__file__">依檔案「分類」欄位（沒有則放「其他」）</option>${Cats.options('')}<option value="__new__">＋新增分類…</option></select></label>
        <div class="two" id="iNew" style="display:none"><label>新分類名稱<input id="iNn" value="${esc(base)}"></label><label>圖示<input id="iNe" value="📍" maxlength="4"></label></div>
        <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="iDup" checked style="width:auto;margin:0"> 略過重複（同名且座標相近）</label>
        <div class="row"><button class="primary" id="iGo">匯入 ${rows.length} 筆</button><button id="iCancel">取消</button></div>`;
      $('#iCat', pv).onchange = e => { $('#iNew', pv).style.display = e.target.value === '__new__' ? '' : 'none'; };
      $('#iCancel', pv).onclick = () => { pv.innerHTML = ''; rows = []; };
      $('#iGo', pv).onclick = () => {
        const sel = $('#iCat', pv).value;
        let newId = null;
        if (sel === '__new__') newId = Cats.ensure({ id: 'c_' + uid(), name: $('#iNn', pv).value.trim() || '匯入', emoji: $('#iNe', pv).value.trim() || '📍', color: '#0ea5e9' }).id;
        const byName = n => {
          const f = Store.state.categories.find(c => c.name === n || c.id === n);
          return f ? f.id : Cats.ensure({ id: 'c_' + uid(), name: n, emoji: '📍', color: '#0ea5e9' }).id;
        };
        const list = rows.map(r => ({
          name: r.name, rating: r.rating, note: r.note, lat: r.lat, lng: r.lng, addr: r.addr, hours: r.hours, src: 'import',
          catId: sel === '__file__' ? (r.catName ? byName(r.catName) : 'other') : sel === '__new__' ? newId : sel
        }));
        const x = Markers.addMany(list, { dedupe: $('#iDup', pv).checked });
        toast(`匯入完成：新增 ${x.n} 筆` + (x.dup ? `，略過重複 ${x.dup} 筆` : ''), 3500);
        if (x.n) map.fitBounds(L.latLngBounds(list.map(m => [m.lat, m.lng])).pad(.1));
        pv.innerHTML = ''; rows = [];
      };
    };

    $('#iFile', el).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      load(Importer.decode(await f.arrayBuffer()), f.name); e.target.value = '';
    };
    $('#iLoad', el).onclick = async () => {
      const u = $('#iUrl', el).value.trim(); if (!u) return;
      pv.innerHTML = '<p class="muted">⏳ 載入中…</p>';
      try { const r = await fetch(u); if (!r.ok) throw new Error('HTTP ' + r.status); load(Importer.decode(await r.arrayBuffer()), u.split('/').pop().split('?')[0] || u); }
      catch (err) { pv.innerHTML = '<p class="muted">❌ 載入失敗（網址錯誤，或對方網站不允許跨來源存取）。可先下載檔案再用上方「選擇檔案」。</p>'; }
    };
    $('#iSample', el).onclick = e => {
      e.preventDefault();
      const csv = '﻿名稱,緯度,經度,地址,營業時間,分類,備註\n示範加油站,25.0478,121.5170,台北市中正區示範路1號,24 小時營業,加油站,範例資料\n示範全聯,25.0420,121.5075,台北市中正區示範街2號,週一至週日 08:00-22:00,超市,範例資料\n';
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'sample-import.csv';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
  }
});

const defZoom = () => Store.state.settings.defaultZoom || 15;
let meMarker = null;
async function locateMe(auto) {
  try {
    const p = await App.getLocation();
    if (meMarker) map.removeLayer(meMarker);
    meMarker = L.circleMarker([p.lat, p.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1 }).addTo(map);
    if (auto) map.setView([p.lat, p.lng], defZoom());
    else map.flyTo([p.lat, p.lng], defZoom());
  } catch (e) { toast(auto ? '無法自動定位，已顯示上次位置' : e.message); }
}
$('#btnLocate').onclick = () => locateMe(false);
$('#btnExport').onclick = () => Store.exportJSON();
$('#btnSide').onclick = () => { document.body.classList.toggle('side-closed'); setTimeout(() => map.invalidateSize(), 50); };
addEventListener('resize', () => map.invalidateSize());

/* ---------------- 啟動 ---------------- */
Markers.render();
UI.refresh();
// 縮放滑桿（地圖左下角）
L.control.scale({ position: 'bottomright', imperial: false, maxWidth: 110 }).addTo(map);   // 比例尺（先加，位於最下方）
const ZoomCtl = L.Control.extend({
  onAdd() {
    const d = L.DomUtil.create('div', 'zoombox');
    d.innerHTML = '<button type="button" id="zOut" title="縮小">－</button><input id="zoomRange" type="range" min="2" max="19" step="1"><button type="button" id="zIn" title="放大">＋</button><b id="zoomVal"></b>';
    L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
    return d;
  }
});
new ZoomCtl({ position: 'bottomright' }).addTo(map);
const zr = $('#zoomRange'), zvEl = $('#zoomVal');
const syncZoom = () => { zr.value = map.getZoom(); zvEl.textContent = map.getZoom(); };
zr.oninput = () => map.setZoom(+zr.value);
$('#zOut').onclick = () => map.zoomOut();
$('#zIn').onclick = () => map.zoomIn();
map.on('zoomend', syncZoom); syncZoom();

// 開啟時依設定決定位置：GPS／預設常用地點／上次位置
function goDefault(auto) {
  const s = Store.state.settings;
  if (s.startMode === 'place') {
    const p = Store.state.places.find(x => x.id === s.defaultPlaceId);
    if (p) { auto ? map.setView([p.lat, p.lng], defZoom()) : map.flyTo([p.lat, p.lng], defZoom()); return true; }
    return false;
  }
  if (s.startMode === 'gps') { locateMe(auto); return true; }
  return false;
}
goDefault(true);
</script>
</body>
</html>
